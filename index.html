<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Equip • Locker Builder</title>
  <meta name="description" content="Ghost Equip - Fortnite cosmetics browser and local locker builder." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #030508;
      --bg-secondary: #080b14;
      --bg-card: rgba(10, 13, 23, 0.88);
      --bg-card-hover: rgba(16, 20, 36, 0.95);
      --border-dim: rgba(99, 102, 241, 0.08);
      --border-active: rgba(99, 102, 241, 0.35);
      --accent-primary: #818cf8;
      --accent-secondary: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-violet: #8b5cf6;
      --accent-fuchsia: #d946ef;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f43f5e;
      --accent-orange: #fb923c;
      --text-primary: #e8eaf6;
      --text-secondary: #94a3b8;
      --text-muted: #5c6370;
      --glow-primary: 0 0 40px rgba(99, 102, 241, 0.12);
      --glow-violet: 0 0 40px rgba(139, 92, 246, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .display-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
    }

    .label-font {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .ambient-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .ambient-bg::before {
      content: '';
      position: absolute; top: -60%; left: -60%; width: 220%; height: 220%;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(217, 70, 239, 0.03) 0%, transparent 40%);
      animation: ambientDrift 40s ease-in-out infinite alternate;
    }
    .ambient-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, var(--bg-primary) 100%);
    }
    @keyframes ambientDrift {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      33% { transform: translate(-2%, 1%) rotate(1deg) scale(1.02); }
      66% { transform: translate(1%, -1%) rotate(-1deg) scale(0.98); }
      100% { transform: translate(-3%, 2%) rotate(2deg) scale(1.01); }
    }

    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 20%, transparent 65%);
    }

    .particles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(99, 102, 241, 0.4);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
    }

    .scanline {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.008) 3px, rgba(0,0,0,0.008) 6px);
    }

    #root { position: relative; z-index: 1; }

    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(1.1);
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }
    .panel:hover, .panel:focus-within {
      border-color: var(--border-active);
      box-shadow: var(--glow-primary);
    }

    .panel-inner {
      background: rgba(6, 8, 16, 0.65);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .panel-inner:hover {
      border-color: rgba(99, 102, 241, 0.18);
      background: rgba(10, 13, 23, 0.75);
    }

    .input-field, .select-field {
      background: rgba(6, 8, 16, 0.75);
      border: 1.5px solid var(--border-dim);
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      width: 100%;
      transition: all 0.3s ease;
      outline: none;
    }
    .input-field:focus, .select-field:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1), 0 0 24px rgba(99, 102, 241, 0.08);
      background: rgba(12, 14, 24, 0.95);
    }
    .input-field::placeholder { color: var(--text-muted); }
    .select-field option { background: #0c1020; color: white; }

    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }

    .btn-cyan {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      box-shadow: 0 2px 16px rgba(99, 102, 241, 0.3);
    }
    .btn-cyan:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45); }

    .btn-violet {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      box-shadow: 0 2px 16px rgba(139, 92, 246, 0.25);
    }
    .btn-violet:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4); }

    .btn-ghost {
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid var(--border-dim);
      color: var(--text-secondary);
    }
    .btn-ghost:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.12);
      border-color: var(--border-active);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.18);
      color: var(--accent-red);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(244, 63, 94, 0.18); }

    .btn-success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.18);
      color: var(--accent-emerald);
    }
    .btn-success:hover:not(:disabled) { background: rgba(52, 211, 153, 0.18); }

    .search-wrap { position: relative; z-index: 2; }
    .search-drop {
      position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
      background: rgba(8, 10, 18, 0.98);
      backdrop-filter: blur(32px);
      border: 1.5px solid var(--border-active);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(99, 102, 241, 0.08);
      max-height: 320px; overflow-y: auto; z-index: 9999;
    }
    .search-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.025);
      transition: all 0.2s ease;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover, .search-item.active {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.1), transparent);
      padding-left: 20px;
    }
    .search-item img {
      width: 42px; height: 42px; border-radius: 10px; object-fit: cover;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .badge {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-ready { background: rgba(52, 211, 153, 0.1); color: var(--accent-emerald); border: 1px solid rgba(52, 211, 153, 0.2); }
    .badge-local { background: rgba(99,102,241,0.1); color: var(--accent-primary); border: 1px solid rgba(99,102,241,0.2); }
    .badge-streamer { background: rgba(217,70,239,0.1); color: var(--accent-fuchsia); border: 1px solid rgba(217,70,239,0.2); }
    .badge-private { background: rgba(251,191,36,0.1); color: var(--accent-amber); border: 1px solid rgba(251,191,36,0.2); }

    .selected-preview {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px; background: rgba(99, 102, 241, 0.04);
      border: 1px solid rgba(99, 102, 241, 0.12);
      border-radius: 12px; margin-top: 10px;
      transition: all 0.3s;
    }
    .selected-preview:hover {
      border-color: rgba(99, 102, 241, 0.25);
      background: rgba(99, 102, 241, 0.06);
    }
    .selected-preview img {
      width: 52px; height: 52px; border-radius: 12px; object-fit: cover;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .cos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .cos-cell {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 10px 6px; background: rgba(0,0,0,0.25); border-radius: 10px; gap: 6px;
      border: 1px solid transparent;
      transition: all 0.3s;
      min-height: 112px;
      justify-content: center;
    }
    .cos-cell:hover {
      border-color: rgba(99, 102, 241, 0.12);
      background: rgba(99, 102, 241, 0.04);
    }
    .cos-cell img { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; }
    .cos-cell span {
      font-size: 10px; color: var(--text-muted); max-width: 100%;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .tab-btn {
      position: relative; padding: 11px 16px; border-radius: 12px;
      font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.3s ease; cursor: pointer; border: none;
      display: flex; align-items: center; gap: 10px;
      background: transparent; color: var(--text-muted); width: 100%; text-align: left;
    }
    .tab-btn:hover { color: var(--text-primary); background: rgba(99, 102, 241, 0.05); }
    .tab-btn.active {
      color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid var(--accent-primary);
      box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.03);
    }

    .section-bar { position: relative; padding-left: 18px; }
    .section-bar::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
      width: 3px; border-radius: 3px;
    }
    .section-bar.primary::before { background: linear-gradient(180deg, var(--accent-primary), var(--accent-violet)); }
    .section-bar.cyan::before { background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue)); }
    .section-bar.violet::before { background: linear-gradient(180deg, var(--accent-violet), var(--accent-fuchsia)); }
    .section-bar.emerald::before { background: linear-gradient(180deg, var(--accent-emerald), var(--accent-cyan)); }
    .section-bar.amber::before { background: linear-gradient(180deg, var(--accent-amber), var(--accent-orange)); }
    .section-bar.fuchsia::before { background: linear-gradient(180deg, var(--accent-fuchsia), var(--accent-violet)); }
    .section-bar.red::before { background: linear-gradient(180deg, var(--accent-red), var(--accent-fuchsia)); }
    .section-bar.blue::before { background: linear-gradient(180deg, var(--accent-blue), var(--accent-cyan)); }

    .header-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-violet), var(--accent-fuchsia), transparent);
      background-size: 200% 100%;
      animation: gradientShift 6s ease infinite;
      border-radius: 0 0 16px 16px;
    }

    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.25);
      position: relative;
    }

    .online-dot {
      width: 8px; height: 8px;
      background: var(--accent-emerald);
      border-radius: 50%;
      border: 2px solid var(--bg-primary);
      animation: breathe 2s ease-in-out infinite;
    }

    .shimmer-text {
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-violet), var(--accent-fuchsia), var(--accent-primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99,102,241,0.1);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .toast-in { animation: slideInR 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-out { animation: slideOutR 0.25s ease forwards; }

    @keyframes slideInR {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutR {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(16px); }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .empty-state {
      text-align: center;
      padding: 38px 20px;
      color: var(--text-muted);
    }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .segmented {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-dim);
      border-radius: 14px;
      flex-wrap: wrap;
    }
    .segmented button {
      background: transparent;
      color: var(--text-muted);
      border: none;
      padding: 9px 14px;
      border-radius: 10px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .segmented button.active {
      color: white;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 6px 18px rgba(99,102,241,0.25);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.25); border-radius: 4px; }

    @media (max-width: 1024px) {
      .layout-main { grid-template-columns: 1fr !important; }
      .cos-grid { grid-template-columns: repeat(2, 1fr); }
      .stats-grid { grid-template-columns: repeat(2, 1fr) !important; }
      .two-col { grid-template-columns: 1fr !important; }
    }

    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr !important; }
      .cos-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="scanline"></div>
  <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div></div>

  <script>
    const particlesEl = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (12 + Math.random() * 20) + 's';
      p.style.animationDelay = (Math.random() * 15) + 's';
      p.style.width = (1 + Math.random() * 2) + 'px';
      p.style.height = p.style.width;
      p.style.opacity = (0.15 + Math.random() * 0.35);
      particlesEl.appendChild(p);
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const FNAPI = "https://fortnite-api.com";

    const DB = {
      save: (k, d) => localStorage.setItem(k, JSON.stringify(d)),
      load: (k, fallback = null) => {
        try {
          const raw = localStorage.getItem(k);
          return raw ? JSON.parse(raw) : fallback;
        } catch {
          return fallback;
        }
      }
    };

    let _tid = 0, _ltm = 0, _lmsg = "";

    function Toasts() {
      const [list, setList] = useState([]);
      const [exit, setExit] = useState(new Set());

      useEffect(() => {
        window._toast = t => {
          const n = Date.now();
          if (t.msg === _lmsg && n - _ltm < 1500) return;
          _ltm = n;
          _lmsg = t.msg;
          setList(p => [...p, t]);
          setTimeout(() => {
            setExit(p => new Set([...p, t.id]));
            setTimeout(() => {
              setList(p => p.filter(x => x.id !== t.id));
              setExit(p => {
                const s = new Set(p);
                s.delete(t.id);
                return s;
              });
            }, 250);
          }, 2600);
        };
        return () => { window._toast = null; };
      }, []);

      return (
        <div style={{ position: 'fixed', bottom: 20, right: 20, zIndex: 99999, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {list.map(t => (
            <div
              key={t.id}
              className={`panel ${exit.has(t.id) ? 'toast-out' : 'toast-in'}`}
              style={{ padding: '12px 18px', display: 'flex', alignItems: 'center', gap: 10, borderColor: t.type === 'er' ? 'rgba(244,63,94,0.25)' : 'rgba(52,211,153,0.25)', minWidth: 220 }}
            >
              <div style={{ width: 24, height: 24, borderRadius: 8, background: t.type === 'er' ? 'rgba(244,63,94,0.12)' : 'rgba(52,211,153,0.12)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <i className={`fas ${t.type === 'er' ? 'fa-circle-xmark' : 'fa-circle-check'}`} style={{ color: t.type === 'er' ? 'var(--accent-red)' : 'var(--accent-emerald)', fontSize: 12 }}></i>
              </div>
              <span style={{ fontSize: 13, fontWeight: 500 }}>{t.msg}</span>
            </div>
          ))}
        </div>
      );
    }

    const toast = {
      s: m => window._toast?.({ id: ++_tid, msg: m, type: "ok" }),
      e: m => window._toast?.({ id: ++_tid, msg: m, type: "er" })
    };

    function StatCard({ icon, label, value, color }) {
      return (
        <div className="panel-inner" style={{ padding: '14px 16px', display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: `${color}12`, display: 'flex', alignItems: 'center', justifyContent: 'center', border: `1px solid ${color}25` }}>
            <i className={`fas ${icon}`} style={{ fontSize: 13, color: color }}></i>
          </div>
          <div>
            <div style={{ fontSize: 10, color: 'var(--text-muted)', fontFamily: "'Rajdhani',sans-serif", fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1.5 }}>{label}</div>
            <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Orbitron',sans-serif", color: color }}>{value}</div>
          </div>
        </div>
      );
    }

    function SelectedItemCard({ item, slot, onClear, onFavorite, isFavorite }) {
      if (!item) return null;
      return (
        <div className="selected-preview">

    function SearchInput({ type, placeholder, onSelect, filterFn }) {
      const [q, setQ] = useState("");
      const [res, setRes] = useState([]);
      const [op, setOp] = useState(false);
      const [ld, setLd] = useState(false);
      const [hi, setHi] = useState(0);
      const ref = useRef(null);

      useEffect(() => {
        const t = setTimeout(async () => {
          if (q.trim().length < 2) {
            setRes([]);
            setOp(false);
            return;
          }

          setLd(true);
          try {
            const r = await fetch(`${FNAPI}/v2/cosmetics/br/search/all?name=${encodeURIComponent(q)}&language=en&matchMethod=contains&type=${type}`);
            const d = await r.json();
            let items = Array.isArray(d.data) ? d.data : [];
            if (filterFn) items = items.filter(filterFn);
            items = items.slice(0, 10);
            setRes(items);
            setHi(0);
            setOp(items.length > 0);
          } catch {
            setRes([]);
            setOp(false);
          } finally {
            setLd(false);
          }
        }, 250);

        return () => clearTimeout(t);
      }, [q, type]);

      useEffect(() => {
        const onDoc = e => {
          if (ref.current && !ref.current.contains(e.target)) setOp(false);
        };
        document.addEventListener("mousedown", onDoc);
        return () => document.removeEventListener("mousedown", onDoc);
      }, []);

      const choose = item => {
        onSelect(item);
        setQ("");
        setRes([]);
        setOp(false);
      };

      return (
        <div ref={ref} className="search-wrap">
          <div style={{ position: 'relative' }}>
            <i className="fas fa-search" style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)', fontSize: 12, zIndex: 2 }}></i>
            <input
              type="text"
              placeholder={placeholder}
              value={q}
              onChange={e => setQ(e.target.value)}
              onFocus={() => res.length && setOp(true)}
              onKeyDown={e => {
                if (!op || !res.length) return;
                if (e.key === "ArrowDown") {
                  e.preventDefault();
                  setHi(v => Math.min(v + 1, res.length - 1));
                } else if (e.key === "ArrowUp") {
                  e.preventDefault();
                  setHi(v => Math.max(v - 1, 0));
                } else if (e.key === "Enter") {
                  e.preventDefault();
                  choose(res[hi]);
                } else if (e.key === "Escape") {
                  setOp(false);
                }
              }}
              className="input-field"
              style={{ paddingLeft: 38 }}
              autoComplete="off"
              spellCheck="false"
            />
            {ld && <i className="fas fa-spinner fa-spin" style={{ position: 'absolute', right: 14, top: '50%', transform: 'translateY(-50%)', color: 'var(--accent-primary)', fontSize: 13 }}></i>}
          </div>

          {op && res.length > 0 && (
            <div className="search-drop">
              {res.map((s, i) => (
                <div
                  key={s.id}
                  className={`search-item ${i === hi ? 'active' : ''}`}
                  onMouseDown={e => {
                    e.preventDefault();
                    choose(s);
                  }}
                >
                  {(s.images?.smallIcon || s.images?.icon) && <img src={s.images.smallIcon || s.images.icon} alt={s.name} />}
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontFamily: "'Rajdhani',sans-serif", fontWeight: 700, fontSize: 14 }}>{s.name}</div>
                    <div style={{ fontSize: 11, color: 'var(--text-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{s.id}</div>
                  </div>
                  {s.rarity?.displayValue && (
                    <span style={{ fontSize: 10, color: 'var(--text-muted)', padding: '2px 8px', background: 'rgba(255,255,255,0.03)', borderRadius: 6, border: '1px solid rgba(255,255,255,0.05)' }}>
                      {s.rarity.displayValue}
                    </span>
                  )}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {tab === "favorites" && (
                <div className="panel section-bar red" style={{ padding: 22 }}>
                  <div className="label-font" style={{ marginBottom: 14 }}>Favorites</div>
                  {favorites.length === 0 ? (
                    <div className="empty-state">
                      <div style={{ width: 52, height: 52, margin: '0 auto 12px', borderRadius: 14, background: 'rgba(99,102,241,0.05)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                        <i className="fas fa-heart" style={{ fontSize: 20, opacity: 0.4 }}></i>
                      </div>
                      <span style={{ fontSize: 13 }}>No favorites yet</span>
                    </div>
                  ) : (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: 12 }}>
                      {favorites.map(f => (
                        <div key={f.key} className="panel-inner" style={{ padding: 14 }}>
                          <div style={{ display: 'flex', gap: 12 }}>
                            {(f.item.images?.icon || f.item.images?.smallIcon) && (
                              <img src={f.item.images.icon || f.item.images.smallIcon} alt={f.item.name} style={{ width: 56, height: 56, borderRadius: 12, objectFit: 'cover' }} />
                            )}
                            <div style={{ minWidth: 0, flex: 1 }}>
                              <div style={{ fontSize: 14, fontWeight: 700 }}>{f.item.name}</div>
                              <div style={{ fontSize: 11, color: 'var(--text-muted)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{f.item.id}</div>
                              <div style={{ fontSize: 11, color: 'var(--text-secondary)', marginTop: 4, textTransform: 'capitalize' }}>{f.slot}</div>
                            </div>
                          </div>
                          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                            <button className="btn btn-cyan" onClick={() => setSlot(f.slot, f.item)}><i className="fas fa-plus"></i>Select</button>
                            <button className="btn btn-danger" onClick={() => toggleFavorite(f.item, f.slot)}><i className="fas fa-heart-crack"></i>Remove</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {recent.length > 0 && (
                    <div style={{ marginTop: 18 }}>
                      <div className="label-font" style={{ marginBottom: 10 }}>Recent Selections</div>
                      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 10 }}>
                        {recent.slice(0, 8).map(r => (
                          <div key={r.key} className="panel-inner" style={{ padding: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
                            {(r.item.images?.smallIcon || r.item.images?.icon) && (
                              <img src={r.item.images.smallIcon || r.item.images.icon} alt="" style={{ width: 42, height: 42, borderRadius: 10, objectFit: 'cover' }} />
                            )}
                            <div style={{ minWidth: 0, flex: 1 }}>
                              <div style={{ fontSize: 13, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{r.item.name}</div>
                              <div style={{ fontSize: 10, color: 'var(--text-muted)', textTransform: 'capitalize' }}>{r.slot}</div>
                            </div>
                            <button className="btn btn-ghost" style={{ padding: '8px 10px' }} onClick={() => setSlot(r.slot, r.item)}>
                              <i className="fas fa-plus"></i>
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {tab === "party" && (
                <>
                  <div className="panel section-bar emerald" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Party Overview</div>
                    <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 12 }}>
                      <span className="badge badge-private"><i className="fas fa-lock"></i>{partyPrivacy}</span>
                      <span className="badge badge-local"><i className="fas fa-map"></i>{playlistMode}</span>
                      {streamerMode && <span className="badge badge-streamer"><i className="fas fa-user-secret"></i>Name Masking On</span>}
                    </div>
                    <p style={{ fontSize: 12, color: 'var(--text-muted)' }}>
                      Playlist, privacy, matchmaking key, and streamer mode here are local planning settings for the UI only.
                    </p>
                  </div>

                  <div className="panel section-bar blue" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Mock Party Members</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                      {mockMembers.map(m => (
                        <div key={m.id} className="panel-inner member-row">
                          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                            <div style={{ width: 40, height: 40, borderRadius: 10, background: m.role === "Leader" ? 'linear-gradient(135deg,#6366f1,#8b5cf6)' : 'rgba(99,102,241,0.06)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                              <i className={`fas ${
                                m.platform === 'PC' ? 'fa-desktop' :
                                m.platform === 'PlayStation' ? 'fa-gamepad' :
                                m.platform === 'Xbox' ? 'fa-xbox' : 'fa-mobile-screen'
                              }`} style={{ color: m.role === "Leader" ? 'white' : 'var(--text-muted)' }}></i>
                            </div>
                            <div>
                              <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                                <span style={{ fontSize: 14, fontWeight: 700 }}>{m.safeName}</span>
                                {m.role === "Leader" && <span className="badge badge-private"><i className="fas fa-crown"></i>Leader</span>}
                              </div>
                              <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>{m.platform} · Lv.{m.level} · {m.crowns} crowns</div>
                            </div>
                          </div>
                          <div>
                            <span className={`badge ${m.status === 'Ready' ? 'badge-ready' : 'badge-local'}`}>{m.status}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}

              {tab === "settings" && (
                <>
                  <div className="panel section-bar primary" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Playlist</div>
                    <div className="segmented">
                      {["Battle Royale", "Zero Build", "Creative", "Festival"].map(mode => (
                        <button
                          key={mode}
                          className={playlistMode === mode ? "active" : ""}
                          onClick={() => {
                            setPlaylistMode(mode);
                            toast.s(`Playlist set to ${mode}`);
                          }}
                        >
                          {mode}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="panel section-bar amber" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Custom Matchmaking Key</div>
                    <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
                      <input
                        className="input-field"
                        placeholder="Enter local planning key..."
                        value={matchKey}
                        onChange={e => setMatchKey(e.target.value)}
                        style={{ maxWidth: 360 }}
                      />
                      <button className="btn btn-ghost" onClick={() => { setMatchKey(""); toast.s("Matchmaking key cleared"); }}>
                        <i className="fas fa-xmark"></i>Clear
                      </button>
                    </div>
                    <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 10 }}>
                      Stored locally as a notes/planning field only.
                    </p>
                  </div>

                  <div className="panel section-bar violet" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Party Privacy</div>
                    <select
                      className="select-field"
                      value={partyPrivacy}
                      onChange={e => {
                        setPartyPrivacy(e.target.value);
                        toast.s(`Privacy set to ${e.target.value}`);
                      }}
                      style={{ maxWidth: 320 }}
                    >
                      <option>Public</option>
                      <option>Friends</option>
                      <option>Private</option>
                    </select>
                  </div>

                  <div className="panel section-bar fuchsia" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Ghost Mode Replacement</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                      <button
                        className={`btn ${streamerMode ? 'btn-violet' : 'btn-ghost'}`}
                        onClick={() => {
                          setStreamerMode(v => !v);
                          toast.s(!streamerMode ? "Streamer mode enabled" : "Streamer mode disabled");
                        }}
                      >
                        <i className={`fas ${streamerMode ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                        {streamerMode ? 'Hide Names On' : 'Hide Names Off'}
                      </button>
                    </div>
                    <p style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 10 }}>
                      This masks player names in the UI for streaming and screenshots.
                    </p>
                  </div>

                  <div className="panel section-bar blue" style={{ padding: 22 }}>
                    <div className="label-font" style={{ marginBottom: 14 }}>Notes</div>
                    <textarea
                      className="input-field"
                      value={notes}
                      onChange={e => setNotes(e.target.value)}
                      placeholder="Add local squad notes, drop plans, item combos, or event reminders..."
                      style={{ minHeight: 140, resize: 'vertical' }}
                    />
                  </div>
                </>
              )}
            </div>
          </div>

          <Toasts />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
