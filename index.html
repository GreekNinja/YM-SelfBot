<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YM SelfBot • FN Party Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #05060b;
      --bg-card: rgba(12, 14, 24, 0.85);
      --bg-card-hover: rgba(18, 20, 36, 0.92);
      --border-dim: rgba(56, 189, 248, 0.08);
      --border-active: rgba(56, 189, 248, 0.35);
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-violet: #8b5cf6;
      --accent-fuchsia: #d946ef;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f43f5e;
      --accent-orange: #fb923c;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --glow-cyan: 0 0 30px rgba(56, 189, 248, 0.15);
      --glow-violet: 0 0 30px rgba(139, 92, 246, 0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .display-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
    }

    .label-font {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* === AMBIENT BACKGROUND === */
    .ambient-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .ambient-bg::before {
      content: '';
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(217, 70, 239, 0.03) 0%, transparent 50%);
      animation: ambientDrift 30s ease-in-out infinite alternate;
    }
    @keyframes ambientDrift {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(-3%, 2%) rotate(3deg); }
    }
    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.018) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }
    .scanline {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.015) 2px, rgba(0,0,0,0.015) 4px);
    }

    #root { position: relative; z-index: 1; }

    /* === GLASS PANELS === */
    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-dim);
      border-radius: 14px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .panel:hover, .panel:focus-within {
      border-color: var(--border-active);
      box-shadow: var(--glow-cyan);
    }
    .panel-inner {
      background: rgba(8, 10, 18, 0.6);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      transition: all 0.3s;
    }
    .panel-inner:hover {
      border-color: rgba(56, 189, 248, 0.15);
    }

    /* === INPUTS === */
    .input-field {
      background: rgba(8, 10, 18, 0.7);
      border: 1.5px solid var(--border-dim);
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      border-radius: 10px;
      width: 100%;
      transition: all 0.25s;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.08), 0 0 20px rgba(56, 189, 248, 0.1);
      background: rgba(12, 14, 24, 0.9);
    }
    .input-field::placeholder { color: var(--text-muted); }

    /* === BUTTONS === */
    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .btn-cyan {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #020617;
      box-shadow: 0 2px 12px rgba(56, 189, 248, 0.25);
    }
    .btn-cyan:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(56, 189, 248, 0.4); }
    .btn-violet {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      box-shadow: 0 2px 12px rgba(139, 92, 246, 0.2);
    }
    .btn-violet:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(139, 92, 246, 0.35); }
    .btn-ghost {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid var(--border-dim);
      color: var(--text-secondary);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(56, 189, 248, 0.12); border-color: var(--border-active); color: var(--text-primary); transform: translateY(-1px); }
    .btn-danger {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.2);
      color: var(--accent-red);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(244, 63, 94, 0.2); border-color: rgba(244, 63, 94, 0.4); }
    .btn-success {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.2);
      color: var(--accent-emerald);
    }
    .btn-success:hover:not(:disabled) { background: rgba(52, 211, 153, 0.2); border-color: rgba(52, 211, 153, 0.4); }
    .btn-amber {
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.2);
      color: var(--accent-amber);
    }
    .btn-amber:hover:not(:disabled) { background: rgba(251, 191, 36, 0.2); border-color: rgba(251, 191, 36, 0.4); }

    /* === COOLDOWN === */
    @keyframes cooldown { from { width: 100%; } to { width: 0%; } }
    .cd-bar {
      position: absolute; bottom: 0; left: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
      animation: cooldown 10s linear forwards;
    }
    .cd-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(2px);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px; font-weight: 700;
      color: var(--accent-red);
      border-radius: inherit;
    }

    /* === SEARCH DROPDOWN === */
    .search-wrap { position: relative; z-index: 1; }
    .search-wrap.open { z-index: 999999; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .search-drop {
      position: absolute; top: calc(100% + 6px); left: 0; width: 100%;
      background: rgba(10, 12, 20, 0.97);
      backdrop-filter: blur(24px);
      border: 1.5px solid var(--border-active);
      border-radius: 10px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.7);
      max-height: 280px; overflow-y: auto; z-index: 999999;
      animation: dropIn 0.2s ease forwards;
    }
    .search-drop::-webkit-scrollbar { width: 5px; }
    .search-drop::-webkit-scrollbar-track { background: transparent; }
    .search-drop::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
    .search-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: all 0.15s;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.1), transparent);
      padding-left: 18px;
    }
    .search-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }

    /* === STATUS BADGES === */
    .badge {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 11px; letter-spacing: 1px;
      text-transform: uppercase; padding: 4px 10px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-ready { background: rgba(52, 211, 153, 0.12); color: var(--accent-emerald); border: 1px solid rgba(52, 211, 153, 0.25); }
    .badge-notready { background: rgba(100, 116, 139, 0.12); color: var(--text-muted); border: 1px solid rgba(100, 116, 139, 0.2); }
    .badge-sitout { background: rgba(251, 191, 36, 0.12); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.25); }
    .badge-ingame { background: rgba(59, 130, 246, 0.12); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.25); }
    .badge-leader { background: rgba(251, 191, 36, 0.15); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.3); }

    /* === SELECTED PREVIEW === */
    .selected-preview {
      display: flex; align-items: center; gap: 12px;
      padding: 10px; background: rgba(56, 189, 248, 0.04);
      border: 1px solid rgba(56, 189, 248, 0.12);
      border-radius: 10px; margin-top: 8px;
    }
    .selected-preview img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }

    /* === COSMETIC GRID === */
    .cos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .cos-cell {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 6px; background: rgba(0,0,0,0.2); border-radius: 8px; gap: 4px;
    }
    .cos-cell img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; }
    .cos-cell span { font-size: 10px; color: var(--text-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* === PARTY SETTINGS GRID === */
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }

    /* === PLAYLIST CARD === */
    .playlist-card {
      background: rgba(8, 10, 18, 0.5);
      border: 1px solid var(--border-dim);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .playlist-card:hover, .playlist-card.active {
      border-color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.06);
    }
    .playlist-card.active { box-shadow: 0 0 16px rgba(56, 189, 248, 0.1); }

    /* === ANIMATIONS === */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideInR { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideOutR { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(12px); } }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 12px rgba(56,189,248,0.15); } 50% { box-shadow: 0 0 28px rgba(56,189,248,0.3); } }

    .anim-up { animation: fadeUp 0.4s ease forwards; }
    .anim-in { animation: fadeIn 0.3s ease forwards; }
    .anim-slide { animation: slideInR 0.3s ease forwards; }
    .toast-in { animation: slideInR 0.2s ease forwards; }
    .toast-out { animation: slideOutR 0.2s ease forwards; }
    .spinner { width: 28px; height: 28px; border: 3px solid rgba(56,189,248,0.1); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 0.7s linear infinite; }

    /* === TAB INDICATOR === */
    .tab-btn {
      position: relative; padding: 10px 14px; border-radius: 10px;
      font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.25s; cursor: pointer; border: none;
      display: flex; align-items: center; gap: 8px;
      background: transparent; color: var(--text-muted); width: 100%; text-align: left;
    }
    .tab-btn:hover { color: var(--text-primary); background: rgba(56, 189, 248, 0.05); }
    .tab-btn.active {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.08);
      border-left: 2px solid var(--accent-cyan);
    }
    .tab-btn .tab-icon { width: 18px; text-align: center; font-size: 13px; }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }

    /* === RESPONSIVE === */
    @media (max-width: 1024px) {
      .cos-grid { grid-template-columns: repeat(2, 1fr); }
      .settings-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .settings-grid { grid-template-columns: 1fr; }
    }

    /* === MEMBER HOVER ACTIONS === */
    .member-actions { opacity: 0; transition: opacity 0.2s; }
    .member-row:hover .member-actions { opacity: 1; }

    /* === INVITE SECTION === */
    .invite-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.15);
      border-radius: 8px; padding: 4px 10px;
      font-size: 12px; color: var(--accent-cyan);
    }

    /* === ACCENT BAR ON SECTIONS === */
    .section-bar { position: relative; padding-left: 16px; }
    .section-bar::before {
      content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
      width: 3px; border-radius: 2px;
    }
    .section-bar.cyan::before { background: var(--accent-cyan); }
    .section-bar.violet::before { background: var(--accent-violet); }
    .section-bar.emerald::before { background: var(--accent-emerald); }
    .section-bar.amber::before { background: var(--accent-amber); }
    .section-bar.fuchsia::before { background: var(--accent-fuchsia); }
    .section-bar.red::before { background: var(--accent-red); }
    .section-bar.blue::before { background: var(--accent-blue); }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="grid-bg"></div>
  <div class="scanline"></div>
  <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    /* ================================================================
       CONSTANTS & CONFIG
    ================================================================ */
    const CORS = "https://corsproxy.io/?";
    const ACCT = "https://account-public-service-prod.ol.epicgames.com";
    const PARTY = "https://party-service-prod.ol.epicgames.com";
    const FNAPI = "https://fortnite-api.com";
    const CONTENT = "https://content-service.bfda.live.use1a.on.epicgames.com";
    const FRIENDS = "https://friends-public-service-prod.ol.epicgames.com";

    const PC_CL = btoa("34a02cf8f4414e29b15921876da36f9a:daafbccc737745039dffe53d94fc76cf");
    const FN_CL = btoa("ec684b8c687f479fadea3cb2ad83f5c6:e1f31c211f28413186262d37a13fc84d");

    const PLATS = { WIN:"PC", MAC:"Mac", PSN:"PlayStation", XBL:"Xbox", SWT:"Switch", IOS:"Mobile", AND:"Android", GFN:"Cloud" };
    const PLAT_ICO = { WIN:"fa-desktop", MAC:"fa-apple", PSN:"fa-playstation", XBL:"fa-xbox", SWT:"fa-gamepad", IOS:"fa-mobile-screen", AND:"fa-mobile-screen", GFN:"fa-cloud" };

    const PLAYLISTS = [
      { id: "playlist_defaultsolo", name: "Solo", icon: "fa-user" },
      { id: "playlist_defaultduo", name: "Duos", icon: "fa-user-group" },
      { id: "playlist_trios", name: "Trios", icon: "fa-users" },
      { id: "playlist_defaultsquad", name: "Squads", icon: "fa-users-rectangle" },
      { id: "playlist_nobuildbr_solo", name: "Zero Build Solo", icon: "fa-ban" },
      { id: "playlist_nobuildbr_duo", name: "Zero Build Duo", icon: "fa-ban" },
      { id: "playlist_nobuildbr_trio", name: "Zero Build Trio", icon: "fa-ban" },
      { id: "playlist_nobuildbr_squad", name: "Zero Build Squad", icon: "fa-ban" },
      { id: "playlist_creative_playv2", name: "Creative", icon: "fa-paintbrush" },
    ];

    /* ================================================================
       COOLDOWN MANAGER
    ================================================================ */
    class CooldownMgr {
      constructor() { this.cd = new Map(); this.ls = new Set(); this.iv = null; }
      listen(fn) { this.ls.add(fn); return () => this.ls.delete(fn); }
      notify() { const o = {}; const n = Date.now(); this.cd.forEach((e,k)=>{ if(e>n) o[k]=Math.ceil((e-n)/1000); else this.cd.delete(k); }); this.ls.forEach(f=>f(o)); }
      set(id) { this.cd.set(id, Date.now()+10000); this.notify(); if(!this.iv) this.iv=setInterval(()=>{ let c=0; this.cd.forEach((e)=>{ if(e>Date.now()) c++; }); this.notify(); if(!c){clearInterval(this.iv);this.iv=null;} },1000); }
      get() { const o={}; const n=Date.now(); this.cd.forEach((e,k)=>{ if(e>n) o[k]=Math.ceil((e-n)/1000); }); return o; }
    }
    const cdMgr = new CooldownMgr();

    /* ================================================================
       UTILITIES
    ================================================================ */
    const DB = { save:(k,d)=>localStorage.setItem(k,JSON.stringify(d)), load:(k)=>JSON.parse(localStorage.getItem(k)||"null") };
    const tokenCache = new Map();
    const cosCache = new Map();
    const uuid = ()=>[...Array(32)].map(()=>Math.floor(Math.random()*16).toString(16)).join('').toUpperCase();
    const sj = async r=>{ try{return await r.json();}catch{return {};} };

    const pf = async (url, opts={}) => {
      try { const r = await fetch(CORS+encodeURIComponent(url), opts); if(r.status===429) throw new Error("Rate limited"); return r; }
      catch(e) { throw new Error(e.message||"Network error"); }
    };

    const ep = async (url, cl, data) => {
      const r = await pf(url, { method:"POST", headers:{"Authorization":`Basic ${cl}`,"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(data).toString() });
      const d = await sj(r); if(!r.ok) throw new Error(d.errorMessage||d.error_description||"Auth failed"); return d;
    };

    const refreshTok = async (a) => {
      if(!a) return a;
      if(Date.now()>a.tokenExpiresAt-300000) {
        const r = await ep(`${ACCT}/account/api/oauth/token`,PC_CL,{grant_type:"refresh_token",refresh_token:a.refreshToken});
        return {...a, accessToken:r.access_token, refreshToken:r.refresh_token, tokenExpiresAt:Date.now()+(r.expires_in*1000)};
      }
      return a;
    };

    const pm = (m,k) => { try { const v=m?.meta?.[k]; if(!v) return {}; return JSON.parse(v); } catch{return {};} };
    const dn = m => m?.meta?.["urn:epic:member:dn_s"]||m?.account_id?.slice(0,8)||"?";
    const gp = m => { const d=pm(m,"Default:PlatformData_j"); return d?.PlatformData?.platform?.platformDescription?.name||m?.connections?.[0]?.meta?.["urn:epic:conn:platform_s"]||"WIN"; };
    const gl = m => pm(m,"Default:BattlePassInfo_j")?.BattlePassInfo?.passLevel||1;
    const gc = m => pm(m,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout?.cosmeticStats?.find(x=>x.statName==="TotalVictoryCrowns")?.statValue||0;

    const getCos = m => {
      const l = pm(m,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
      const e = pm(m,"Default:FrontendEmote_j")?.FrontendEmote||{};
      return {
        skin:l.characterPrimaryAssetId||"None", backpack:l.backpackDef||"None",
        pickaxe:l.pickaxeDef||"None", emote:e.pickable||"None",
        skinId:l.characterPrimaryAssetId?.replace("AthenaCharacter:","").replace(/\/BRCosmetics.*\//,"").replace(".",""),
        emoteId:e.pickable?.replace(/\/BRCosmetics.*Dances\//,"").replace(".",""),
        fullLoadout:l
      };
    };

    const getCosImg = async (id, type) => {
      if(!id||id==="None") return null;
      const ck=`${type}_${id}`;
      if(cosCache.has(ck)) return cosCache.get(ck);
      try {
        let t="outfit"; if(type==="emote")t="emote"; if(type==="backpack")t="backpack"; if(type==="pickaxe")t="pickaxe";
        let cid=id; if(cid.includes(":"))cid=cid.split(":")[1]; if(cid.includes("/"))cid=cid.split("/").pop().split(".")[0];
        const r=await(await fetch(`${FNAPI}/v2/cosmetics/br/search?id=${encodeURIComponent(cid)}&type=${t}`)).json();
        if(r.data?.images){ const u=r.data.images.smallIcon||r.data.images.icon; cosCache.set(ck,u); return u; }
      } catch{}
      return null;
    };

    const getReadiness = m => {
      const rd=m.meta?.["Default:GameReadiness_s"]||"";
      const ls=m.meta?.["Default:Location_s"]||"";
      if(rd==="Playing"||ls==="InGame") return "ingame";
      if(rd==="SittingOut") return "sitout";
      if(rd==="Ready") return "ready";
      return "notready";
    };

    /* ================================================================
       TOAST SYSTEM
    ================================================================ */
    let _tid=0, _ltm=0, _lmsg="";
    function Toasts(){
      const [list,setList]=useState([]); const [exit,setExit]=useState(new Set());
      useEffect(()=>{
        window._toast=t=>{
          const n=Date.now(); if(t.msg===_lmsg&&n-_ltm<2000)return; _ltm=n;_lmsg=t.msg;
          setList(p=>[...p,t]);
          setTimeout(()=>{setExit(p=>new Set([...p,t.id])); setTimeout(()=>{setList(p=>p.filter(x=>x.id!==t.id)); setExit(p=>{const s=new Set(p);s.delete(t.id);return s;});},200);},2500);
        };
        return ()=>{window._toast=null;};
      },[]);
      return <div style={{position:'fixed',bottom:16,right:16,zIndex:99999,display:'flex',flexDirection:'column',gap:8}}>
        {list.map(t=><div key={t.id} className={`panel ${exit.has(t.id)?'toast-out':'toast-in'}`} style={{padding:'10px 16px',display:'flex',alignItems:'center',gap:10,borderColor:t.type==='er'?'rgba(244,63,94,0.3)':'rgba(52,211,153,0.3)'}}>
          <i className={`fas ${t.type==='er'?'fa-circle-xmark':'fa-circle-check'}`} style={{color:t.type==='er'?'var(--accent-red)':'var(--accent-emerald)',fontSize:14}}></i>
          <span style={{fontSize:13}}>{t.msg}</span>
        </div>)}
      </div>;
    }
    const toast={s:m=>window._toast?.({id:++_tid,msg:m,type:"ok"}),e:m=>window._toast?.({id:++_tid,msg:m,type:"er"})};

    /* ================================================================
       COOLDOWN BUTTON
    ================================================================ */
    function CdBtn({id,onClick,children,className="",disabled,variant="ghost",title:t}){
      const [cds,setCds]=useState({});
      useEffect(()=>{ const u=c=>setCds(c); u(cdMgr.get()); return cdMgr.listen(u); },[]);
      const on=cds[id]>0;
      const cls=variant==="cyan"?"btn-cyan":variant==="violet"?"btn-violet":variant==="danger"?"btn-danger":variant==="success"?"btn-success":variant==="amber"?"btn-amber":"btn-ghost";
      return <button onClick={async e=>{if(on||disabled)return;cdMgr.set(id);if(onClick)await onClick(e);}} disabled={on||disabled} className={`btn ${cls} ${className}`} title={on?`${cds[id]}s`:t}>
        {children}
        {on&&<><div className="cd-overlay">{cds[id]}s</div><div className="cd-bar"/></>}
      </button>;
    }

    /* ================================================================
       SEARCH INPUT
    ================================================================ */
    function SearchInput({type,placeholder,onSelect}){
      const [q,setQ]=useState(""); const [res,setRes]=useState([]); const [op,setOp]=useState(false); const [ld,setLd]=useState(false);
      const ref=useRef(); const iref=useRef(); const uid=useRef(`s-${Date.now()}-${Math.random()}`).current;

      useEffect(()=>{
        const t=setTimeout(async()=>{
          if(q.length<2){setOp(false);return;}
          setLd(true);
          try{const r=await(await fetch(`${FNAPI}/v2/cosmetics/br/search/all?name=${encodeURIComponent(q)}&language=en&matchMethod=contains&type=${type}`)).json(); if(r.data?.length){setRes(r.data.slice(0,6));setOp(true);}else{setRes([]);setOp(false);}}
          catch{setRes([]);setOp(false);}
          setLd(false);
        },350);
        return ()=>clearTimeout(t);
      },[q,type]);

      useEffect(()=>{const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOp(false);}; document.addEventListener('mousedown',h); return ()=>document.removeEventListener('mousedown',h);},[]);

      return <div ref={ref} className={`search-wrap${op?' open':''}`}>
        <div style={{position:'relative'}}>
          <input ref={iref} type="text" placeholder={placeholder} value={q} onChange={e=>setQ(e.target.value)} onFocus={()=>{if(q.length>=2&&res.length)setOp(true);}} className="input-field" autoComplete="off" spellCheck="false"/>
          {ld&&<i className="fas fa-spinner fa-spin" style={{position:'absolute',right:12,top:'50%',transform:'translateY(-50%)',color:'var(--accent-cyan)',fontSize:13}}></i>}
        </div>
        {op&&res.length>0&&<div className="search-drop">
          {res.map(s=><div key={s.id} className="search-item" onMouseDown={e=>{e.preventDefault();onSelect(s);setQ("");setOp(false);}}>
            {(s.images?.smallIcon||s.images?.icon)&&<img src={s.images.smallIcon||s.images.icon} alt={s.name}/>}
            <div><div style={{fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:14,color:'var(--text-primary)'}}>{s.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{s.id}</div></div>
          </div>)}
        </div>}
      </div>;
    }

    /* ================================================================
       COSMETIC IMAGE
    ================================================================ */
    function CosImg({id,type,size=40}){
      const [url,setUrl]=useState(null); const [ld,setLd]=useState(true);
      useEffect(()=>{if(!id||id==="None"){setLd(false);return;} getCosImg(id,type).then(u=>{setUrl(u);setLd(false);});},[id,type]);

    /* ================================================================
       MAIN APP
    ================================================================ */
    function App(){
      const [accounts,setAccts]=useState([]);
      const [active,setActive]=useState(null);
      const [party,setParty]=useState(null);
      const [loading,setLd]=useState(false);
      const [tab,setTab]=useState("match");
      const [authCode,setAuthCode]=useState("");
      const [busy,setBusy]=useState({});
      const [level,setLv]=useState(100);
      const [autoEmote,setAutoEmote]=useState("EID_IceKing");
      const [memberDetails,setMemberDetails]=useState({});
      const [islandCode,setIslandCode]=useState("");
      const [selectedSkin,setSelectedSkin]=useState(null);
      const [selectedBackpack,setSelectedBackpack]=useState(null);
      const [selectedPickaxe,setSelectedPickaxe]=useState(null);
      const [selectedEmote,setSelectedEmote]=useState(null);
      const [inviteUser,setInviteUser]=useState("");
      const [bannerIcon,setBannerIcon]=useState("StandardBanner1");
      const [bannerColor,setBannerColor]=useState("DefaultColor1");
      const [partyPrivacy,setPartyPrivacy]=useState("Public");
      const [crowns,setCrowns]=useState(0);
      const [customKey,setCustomKey]=useState("");

      // Token refresh
      useEffect(()=>{
        if(!active) return;
        const iv=setInterval(async()=>{
          try{const r=await refreshTok(active); if(r!==active){setActive(r);const u=accounts.map(a=>a.accountId===r.accountId?r:a);setAccts(u);DB.save("accounts",u);}}
          catch{toast.e("Session expired");setActive(null);setParty(null);}
        },60000);
        return ()=>clearInterval(iv);
      },[active,accounts]);

      useEffect(()=>{const s=DB.load("accounts");if(s?.length){setAccts(s);selectAccount(s[0]);}},[]);

      useEffect(()=>{
        if(!party?.members) return;
        const load=async()=>{const d={};for(const m of party.members) d[m.account_id]=getCos(m);setMemberDetails(d);};
        load();
      },[party]);

      const removeAccount=id=>{const u=accounts.filter(x=>x.accountId!==id);setAccts(u);DB.save("accounts",u);if(active?.accountId===id){setActive(null);setParty(null);}toast.s("Account removed");};

      const getFnTok=async(acct)=>{
        let a=await refreshTok(acct);
        if(a!==acct){setActive(a);const u=accounts.map(x=>x.accountId===a.accountId?a:x);setAccts(u);DB.save("accounts",u);acct=a;}
        const c=tokenCache.get(a.accountId);
        if(c&&c.exp>Date.now()) return c.tok;
        const ex=await sj(await pf(`${ACCT}/account/api/oauth/exchange`,{headers:{Authorization:`Bearer ${a.accessToken}`}}));
        if(!ex.code){removeAccount(a.accountId);throw new Error("Exchange failed");}
        const fn=await ep(`${ACCT}/account/api/oauth/token`,FN_CL,{grant_type:"exchange_code",exchange_code:ex.code});
        tokenCache.set(a.accountId,{tok:fn.access_token,exp:Date.now()+(fn.expires_in-60)*1000});
        return fn.access_token;
      };

      const loadParty=async(a)=>{
        setLd(true);
        try{const t=await getFnTok(a);const r=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${a.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));setParty(r.current?.[0]||null);}
        catch(e){setParty(null);toast.e(e.message);}
        finally{setLd(false);}
      };

      const selectAccount=async a=>{setActive(a);setParty(null);toast.s(`Welcome, ${a.displayName}`);await loadParty(a);};

      const linkAccount=async()=>{
        if(!authCode.trim())return; setLd(true);
        try{
          const r=await ep(`${ACCT}/account/api/oauth/token`,PC_CL,{grant_type:"authorization_code",code:authCode.trim()});
          const a={accountId:r.account_id,displayName:r.displayName||r.account_id,accessToken:r.access_token,refreshToken:r.refresh_token,tokenExpiresAt:Date.now()+(r.expires_in*1000)};
          const u=[...accounts.filter(x=>x.accountId!==a.accountId),a];setAccts(u);DB.save("accounts",u);setAuthCode("");selectAccount(a);
        }catch(e){toast.e(e.message);}finally{setLd(false);}
      };

      const getLatestRev=async()=>{
        try{const t=await getFnTok(active);const r=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${active.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));
        const p=r.current?.[0];if(p){const mm=p.members.find(m=>m.account_id===active.accountId);return{partyRev:p.revision,memberRev:mm?.revision||0,party:p};}
        }catch{}return{partyRev:0,memberRev:0,party:null};
      };

      const doAction=async(type,payload,msg)=>{
        setBusy(p=>({...p,[type]:true}));
        try{
          if(!party?.id) throw new Error("No party found");
          let a=await refreshTok(active);if(a!==active){setActive(a);const u=accounts.map(x=>x.accountId===a.accountId?a:x);setAccts(u);DB.save("accounts",u);}
          const t=await getFnTok(a);
          const rv=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${active.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));
          const pty=rv.current?.[0]; if(!pty) throw new Error("Party not found");
          const pId=pty.id, myRev=pty.members?.find(m=>m.account_id===active.accountId)?.revision||0, pRev=pty.revision||0;
          let url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${active.accountId}/meta`, method="PATCH", body=null;

          if(type==="meta"||type==="party_meta"){
            const isP=type==="party_meta"; if(isP)url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/meta`;
            const upd={}; const src=isP?pty:pty.members.find(m=>m.account_id===active.accountId);
            for(const[k,v]of Object.entries(payload)){if(typeof v==='function'){let o={};if(src?.meta?.[k])try{o=JSON.parse(src.meta[k]);}catch{}upd[k]=JSON.stringify(v(o));}else upd[k]=v;}
            body={update:upd,delete:[],revision:isP?pRev:myRev};
          } else if(type==="promote"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${payload.target}/promote`;method="POST";body={};
          } else if(type==="kick"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${payload.target}`;method="DELETE";
          } else if(type==="invite"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/invites/${payload.target}?sendPing=true`;method="POST";body={};
          } else if(type==="party_config"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}`;method="PATCH";body={config:payload,revision:pRev};
          }

          const opts={method,headers:{Authorization:`Bearer ${t}`}};
          if(body){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body);}
          const r=await pf(url,opts);
          if(r.status===404){if(msg)toast.s(msg);setTimeout(()=>loadParty(active),600);return;}
          if(!r.ok){const e=await sj(r);throw new Error(e.errorMessage||"Failed");}
          if(msg)toast.s(msg);setTimeout(()=>loadParty(active),600);
        }catch(e){toast.e(e.message);}finally{setBusy(p=>({...p,[type]:false}));}
      };

      // === COPY LOCKER ===
      const copyLocker=async(tid)=>{
        const tm=party?.members?.find(m=>m.account_id===tid);if(!tm){toast.e("Not found");return;}
        const tc=memberDetails[tid]||getCos(tm);const tn=dn(tm);const tl=gl(tm);
        try{
          await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:"None",emoteEKey:"",emoteSection:-1,multipurposeEmoteData:-1}})},null);
          await new Promise(r=>setTimeout(r,300));
          await doAction("meta",{"Default:AthenaCosmeticLoadout_j":o=>{return{AthenaCosmeticLoadout:{...tc.fullLoadout,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}};}},null);
          await new Promise(r=>setTimeout(r,500));
          if(tc.emote!=="None") await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:tc.emote,emoteEKey:"",emoteSection:-2,multipurposeEmoteData:-1}})},null);
          await doAction("meta",{"Default:BattlePassInfo_j":JSON.stringify({BattlePassInfo:{bHasPurchasedPass:true,passLevel:tl}}),"Default:AthenaBannerInfo_j":JSON.stringify({AthenaBannerInfo:{bannerIconId:"StandardBanner1",bannerColorId:"DefaultColor1",seasonLevel:tl}})},null);
          toast.s(`Copied ${tn}'s locker`);
        }catch(e){toast.e(e.message);}
      };

      // === SET SKIN ===
      const handleSetSkin=async()=>{
        if(!selectedSkin){toast.e("Select a skin first");return;}
        const{memberRev}=await getLatestRev();
        let fid=selectedSkin.id; if(!fid.startsWith("AthenaCharacter:")&&!fid.includes("/BRCosmetics/"))fid=`AthenaCharacter:${selectedSkin.id}`;
        const cm=party.members.find(m=>m.account_id===active.accountId);
        const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        const up={"Default:AthenaCosmeticLoadout_j":JSON.stringify({AthenaCosmeticLoadout:{...cl,characterPrimaryAssetId:fid,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}}),"Default:AthenaCosmeticLoadoutVariants_j":JSON.stringify({AthenaCosmeticLoadoutVariants:{vL:{},vD:{athenaCharacter:{i:["0|0"]}},fT:false}})};
        try{const t=await getFnTok(active);const r=await pf(`${PARTY}/party/api/v1/Fortnite/parties/${party.id}/members/${active.accountId}/meta`,{method:"PATCH",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({update:up,delete:[],revision:memberRev})});
        if(r.ok){toast.s(`Skin: ${selectedSkin.name}`);setTimeout(()=>loadParty(active),800);}else{const e=await sj(r);if(e.errorCode?.includes("stale_revision")){toast.s("Retrying...");setTimeout(()=>handleSetSkin(),500);}else toast.e("Failed");}
        }catch(e){toast.e(e.message);}
      };

      // === SET BACKPACK ===
      const handleSetBackpack=async()=>{
        if(!selectedBackpack){toast.e("Select a backpack first");return;}
        const{memberRev}=await getLatestRev();
        let fp=selectedBackpack.id;if(!fp.includes("/BRCosmetics/"))fp=`/BRCosmetics/Athena/Items/Cosmetics/Backpacks/${fp}.${fp}`;
        const cm=party.members.find(m=>m.account_id===active.accountId);const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        try{const t=await getFnTok(active);await pf(`${PARTY}/party/api/v1/Fortnite/parties/${party.id}/members/${active.accountId}/meta`,{method:"PATCH",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({update:{"Default:AthenaCosmeticLoadout_j":JSON.stringify({AthenaCosmeticLoadout:{...cl,backpackDef:fp,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}})},delete:[],revision:memberRev})});
        toast.s(`Backpack: ${selectedBackpack.name}`);setTimeout(()=>loadParty(active),800);
        }catch(e){toast.e(e.message);}
      };

      // === SET PICKAXE ===
      const handleSetPickaxe=async()=>{
        if(!selectedPickaxe){toast.e("Select a pickaxe first");return;}
        const{memberRev}=await getLatestRev();
        let fp=selectedPickaxe.id;if(!fp.includes("/BRCosmetics/"))fp=`/BRCosmetics/Athena/Items/Cosmetics/Pickaxes/${fp}.${fp}`;
        const cm=party.members.find(m=>m.account_id===active.accountId);const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        try{const t=await getFnTok(active);await pf(`${PARTY}/party/api/v1/Fortnite/parties/${party.id}/members/${active.accountId}/meta`,{method:"PATCH",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({update:{"Default:AthenaCosmeticLoadout_j":JSON.stringify({AthenaCosmeticLoadout:{...cl,pickaxeDef:fp,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}})},delete:[],revision:memberRev})});
        toast.s(`Pickaxe: ${selectedPickaxe.name}`);setTimeout(()=>loadParty(active),800);
        }catch(e){toast.e(e.message);}
      };

      // === EMOTE ===
      const handleEmote=async(stop=false)=>{
        if(stop){await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:"None",emoteEKey:"",emoteSection:-1,multipurposeEmoteData:-1}})},"Emote stopped");return;}
        if(!selectedEmote){toast.e("Select an emote first");return;}
        let fid=selectedEmote.id;if(!fid.startsWith("/BRCosmetics/"))fid=`/BRCosmetics/Athena/Items/Cosmetics/Dances/${fid}.${fid}`;
        await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:fid,emoteEKey:"",emoteSection:-2,multipurposeEmoteData:-1}})},"Playing emote");
      };

      // === SET LEVEL ===
      const handleSetLevel=async()=>{
        await doAction("meta",{"Default:BattlePassInfo_j":JSON.stringify({BattlePassInfo:{bHasPurchasedPass:true,passLevel:level}}),"Default:AthenaBannerInfo_j":JSON.stringify({AthenaBannerInfo:{bannerIconId:bannerIcon,bannerColorId:bannerColor,seasonLevel:level}})},`Level ${level}`);
      };

      // === SET CROWNS ===
      const handleSetCrowns=async()=>{
        const cm=party.members.find(m=>m.account_id===active.accountId);const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        const stats=cl.cosmeticStats?.map(s=>s.statName==="TotalVictoryCrowns"?{...s,statValue:crowns}:s)||[{statName:"TotalVictoryCrowns",statValue:crowns}];
        await doAction("meta",{"Default:AthenaCosmeticLoadout_j":o=>{const c=o.AthenaCosmeticLoadout||{};return{AthenaCosmeticLoadout:{...c,cosmeticStats:stats,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}};}},`Crowns: ${crowns}`);
      };

      // === SET PLAYLIST ===
      const handleSetPlaylist=async(plId)=>{
        await doAction("party_meta",{"Default:PlaylistData_j":JSON.stringify({PlaylistData:{playlistName:plId,tournamentId:"",eventWindowId:"",linkCode:customKey||""}})},`Playlist set`);
      };

      // === PARTY PRIVACY ===
      const handlePrivacy=async(priv)=>{
        const privMap={
          "Public":{partyType:"Public",bOnlyLeaderFriendsCanJoin:false,presencePermissions:63,invitePermissions:63,acceptingMembers:true},
          "Friends":{partyType:"Public",bOnlyLeaderFriendsCanJoin:true,presencePermissions:0,invitePermissions:0,acceptingMembers:true},
          "Private":{partyType:"Private",bOnlyLeaderFriendsCanJoin:false,presencePermissions:0,invitePermissions:0,acceptingMembers:false}
        };
        const cfg=privMap[priv]||privMap["Public"];
        await doAction("party_meta",{"Default:PartyState_s":priv,"Default:PrivacySettings_j":JSON.stringify({PrivacySettings:{...cfg}})},`Party: ${priv}`);
        setPartyPrivacy(priv);
      };

      // === INVITE ===
      const handleInvite=async()=>{
        if(!inviteUser.trim())return;
        try{
          const t=await getFnTok(active);
          // Lookup user by display name
          const lr=await sj(await pf(`${ACCT}/account/api/public/account/displayName/${encodeURIComponent(inviteUser.trim())}`,{headers:{Authorization:`Bearer ${t}`}}));
          if(!lr.id){toast.e("User not found");return;}
          await doAction("invite",{target:lr.id},`Invited ${inviteUser}`);
          setInviteUser("");
        }catch(e){toast.e(e.message);}
      };

      // === ISLAND LAUNCH ===
      const launchIsland=async()=>{
        if(!islandCode.trim()||!active) return;
        const sm=party?.members||[];const isL=sm.find(m=>m.account_id===active.accountId)?.role==="CAPTAIN";
        if(!isL){toast.e("Only leader can launch");return;}
        try{
          const t=await getFnTok(active);const cc=islandCode.trim().replace(/[^0-9-]/g,'');
          if(cc.length<4)throw new Error("Invalid code");
          const r=await pf(`${CONTENT}/api/content/v2/launch/link/${cc}`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({})});
          const d=await sj(r);
          if(r.ok||d.status==="notified"){toast.s(`Launched: ${cc}`);setIslandCode("");}else throw new Error(d.errorMessage||"Failed");
        }catch(e){toast.e(e.message);}
      };

      // === CUSTOM MATCHMAKING KEY ===
      const handleCustomKey=async()=>{
        await doAction("party_meta",{"Default:CustomMatchKey_s":customKey||""},customKey?`Custom key: ${customKey}`:"Custom key cleared");
      };

      // === FAKE MATCH ===
      const fakeMatch=async()=>{
        const s=uuid();
        await doAction("meta",{"Default:GameReadiness_s":"Playing","Default:Location_s":"InGame","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="InGame";return o;},"Default:MatchmakingInfo_j":o=>{if(!o.MatchmakingInfo)o.MatchmakingInfo={};o.MatchmakingInfo.readyStatus="NotReady";o.MatchmakingInfo.worldSessionId=s;o.MatchmakingInfo.travelId=s;return o;}},"In match");
      };

      const leaveMatch=async()=>{
        await doAction("meta",{"Default:GameReadiness_s":"NotReady","Default:Location_s":"PreLobby","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="PreLobby";return o;},"Default:MatchmakingInfo_j":o=>{if(o.MatchmakingInfo)o.MatchmakingInfo.readyStatus="NotReady";return o;}},"Left match");
      };

      // === READINESS ===
      const setReady=async(state)=>{
        const map={Ready:"Ready",NotReady:"NotReady",SittingOut:"SittingOut"};
        await doAction("meta",{"Default:GameReadiness_s":map[state]||"NotReady","Default:Location_s":"PreLobby","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="PreLobby";return o;},"Default:MatchmakingInfo_j":o=>{if(o.MatchmakingInfo)o.MatchmakingInfo.readyStatus=map[state]||"NotReady";return o;}},state);
      };

      // === HIDE NAMES (Ghost mode) ===
      const ghostMode=async()=>{
        await doAction("meta",{"Default:CampaignHero_j":JSON.stringify({CampaignHero:{heroItemInstanceId:"",heroType:"/Game/Athena/Heroes/HID_001_Athena_Commando_F.HID_001_Athena_Commando_F"}})},"Ghost mode on");
      };

      /* ================================================================
         LOGIN SCREEN
      ================================================================ */
      if(!active) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div className="panel anim-up" style={{maxWidth:420,width:'100%',padding:32}}>
          <div style={{textAlign:'center',marginBottom:28}}>
            <div style={{width:56,height:56,margin:'0 auto 16px',borderRadius:14,background:'linear-gradient(135deg,#0ea5e9,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 30px rgba(56,189,248,0.2)'}}>
              <i className="fas fa-bolt" style={{fontSize:22,color:'white'}}></i>
            </div>
            <h1 className="display-font" style={{fontSize:22,background:'linear-gradient(135deg,#38bdf8,#a78bfa)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>YM SELFBOT</h1>
            <p style={{fontSize:12,color:'var(--text-muted)',marginTop:6,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2,textTransform:'uppercase'}}>Fortnite Party Manager</p>
          </div>

          {accounts.length>0&&<div style={{marginBottom:20}}>
            <div className="label-font" style={{marginBottom:8}}>Saved Accounts</div>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {accounts.map(a=><div key={a.accountId} onClick={()=>selectAccount(a)} className="panel-inner" style={{padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <div style={{width:32,height:32,borderRadius:8,background:'linear-gradient(135deg,#0ea5e9,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-user" style={{fontSize:11,color:'white'}}></i></div>
                  <span style={{fontSize:14,fontWeight:600}}>{a.displayName}</span>
                </div>
                <button onClick={e=>{e.stopPropagation();removeAccount(a.accountId);}} className="btn btn-danger" style={{padding:'4px 8px',fontSize:11}}><i className="fas fa-trash"></i></button>
              </div>)}
            </div>
          </div>}

          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <a href="https://www.epicgames.com/id/api/redirect?clientId=34a02cf8f4414e29b15921876da36f9a&responseType=code" target="_blank" className="btn btn-ghost" style={{width:'100%',textDecoration:'none'}}><i className="fas fa-key"></i> Get Auth Code</a>
            <div style={{display:'flex',gap:8}}>
              <input type="text" placeholder="Paste auth code" value={authCode} onChange={e=>setAuthCode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&linkAccount()} className="input-field" style={{flex:1}}/>
              <button onClick={linkAccount} disabled={loading||!authCode.trim()} className="btn btn-cyan" style={{minWidth:60}}>{loading?<i className="fas fa-spinner fa-spin"></i>:"Link"}</button>
            </div>
            <p style={{fontSize:11,color:'var(--text-muted)',textAlign:'center',marginTop:4}}><i className="fas fa-lock" style={{marginRight:4,color:'var(--accent-cyan)'}}></i>Tokens stored locally only</p>
          </div>
        </div>
      </div>;

      /* ================================================================
         MAIN DASHBOARD
      ================================================================ */
      const sm=party?.members||[];
      const isCap=sm.find(m=>m.account_id===active.accountId)?.role==="CAPTAIN";

      const TABS=[
        {id:"match",icon:"fa-crosshairs",label:"Match"},
        {id:"locker",icon:"fa-shirt",label:"Locker"},
        {id:"stats",icon:"fa-chart-bar",label:"Profile"},
        {id:"party",icon:"fa-sliders",label:"Party Config"},
        {id:"members",icon:"fa-users",label:`Members (${sm.length})`},
        {id:"islands",icon:"fa-globe",label:"Islands"},
      ];

      return <div style={{minHeight:'100vh',padding:'16px',maxWidth:1200,margin:'0 auto'}}>
        {/* HEADER */}
        <div className="panel anim-up" style={{padding:'12px 20px',marginBottom:16,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{display:'flex',alignItems:'center',gap:14}}>
            <div style={{width:40,height:40,borderRadius:10,background:'linear-gradient(135deg,#0ea5e9,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
              <i className="fas fa-bolt" style={{fontSize:16,color:'white'}}></i>
              <div style={{position:'absolute',bottom:-2,right:-2,width:10,height:10,background:'var(--accent-emerald)',borderRadius:'50%',border:'2px solid var(--bg-primary)'}}></div>
            </div>
            <div>
              <h1 className="display-font" style={{fontSize:15,color:'var(--accent-cyan)'}}>YM SELFBOT</h1>
              <div style={{fontSize:12,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:6}}><i className="fas fa-circle" style={{fontSize:5,color:'var(--accent-emerald)'}}></i>{active.displayName}{isCap&&<span className="badge badge-leader" style={{marginLeft:4}}><i className="fas fa-crown" style={{fontSize:8}}></i>Leader</span>}</div>
            </div>
          </div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>loadParty(active)} disabled={loading} className="btn btn-ghost" style={{fontSize:12}}><i className={`fas fa-sync-alt${loading?' fa-spin':''}`} style={{fontSize:11}}></i>Refresh</button>
            <button onClick={()=>{setActive(null);setParty(null);}} className="btn btn-danger" style={{fontSize:12}}><i className="fas fa-right-from-bracket" style={{fontSize:11}}></i>Exit</button>
          </div>
        </div>

        {!party?<div className="panel anim-up" style={{padding:48,textAlign:'center'}}>
          <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>🎮</div>
          <h2 className="display-font" style={{fontSize:18,color:'var(--accent-cyan)',marginBottom:8}}>No Active Party</h2>
          <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>Launch Fortnite and join a lobby</p>
          <button onClick={()=>loadParty(active)} className="btn btn-cyan"><i className="fas fa-sync-alt"></i>Check Again</button>
        </div>:

        <div style={{display:'grid',gridTemplateColumns:'200px 1fr',gap:16}}>
          {/* SIDEBAR */}
          <div className="panel anim-up" style={{padding:10,alignSelf:'start',position:'sticky',top:16}}>
            <div style={{display:'flex',flexDirection:'column',gap:2}}>
              {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`tab-btn${tab===t.id?' active':''}`}>
                <span className="tab-icon"><i className={`fas ${t.icon}`}></i></span>
                <span>{t.label}</span>
              </button>)}
            </div>
          </div>

          {/* CONTENT */}
          <div style={{display:'flex',flexDirection:'column',gap:14}} className="anim-slide">

            {/* === MATCH TAB === */}
            {tab==="match"&&<>
              <div className="panel section-bar emerald" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Readiness</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>
                  <CdBtn id="rdy" onClick={()=>setReady("Ready")} variant="success"><i className="fas fa-check"></i> Ready</CdBtn>
                  <CdBtn id="nrdy" onClick={()=>setReady("NotReady")}><i className="fas fa-xmark"></i> Not Ready</CdBtn>
                  <CdBtn id="sit" onClick={()=>setReady("SittingOut")} variant="amber"><i className="fas fa-moon"></i> Sit Out</CdBtn>
                  <CdBtn id="stnd" onClick={()=>setReady("NotReady")} variant="ghost"><i className="fas fa-person"></i> Stand In</CdBtn>
                </div>
              </div>

              <div className="panel section-bar violet" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Fake Match</div>
                <div style={{display:'flex',gap:8}}>
                  <CdBtn id="fmatch" onClick={fakeMatch} variant="violet" className="flex-1"><i className="fas fa-play"></i> Enter Match</CdBtn>
                  <CdBtn id="lmatch" onClick={leaveMatch} className="flex-1"><i className="fas fa-door-open"></i> Leave Match</CdBtn>
                </div>
              </div>

              <div className="panel section-bar cyan" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Invite Player</div>
                <div style={{display:'flex',gap:8}}>
                  <input type="text" placeholder="Epic display name" value={inviteUser} onChange={e=>setInviteUser(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleInvite()} className="input-field" style={{flex:1}}/>
                  <CdBtn id="invite" onClick={handleInvite} variant="cyan" disabled={!inviteUser.trim()}><i className="fas fa-paper-plane"></i> Invite</CdBtn>
                </div>
              </div>
            </>}

            {/* === LOCKER TAB === */}
            {tab==="locker"&&<>
              <div className="panel" style={{padding:'12px 16px',background:'rgba(56,189,248,0.03)',borderColor:'rgba(56,189,248,0.12)'}}>
                <p style={{fontSize:12,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:6}}><i className="fas fa-info-circle" style={{color:'var(--accent-cyan)'}}></i>Set to <span style={{color:'var(--accent-amber)'}}>Sit Out</span> or <span style={{color:'var(--text-secondary)'}}>Not Ready</span> before changing cosmetics</p>
              </div>

              {/* SKIN */}
              <div className="panel section-bar violet" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:10}}>Skin</div>
                <SearchInput type="outfit" placeholder="Search skins..." onSelect={setSelectedSkin}/>
                {selectedSkin&&<div className="selected-preview"><img src={selectedSkin.images?.icon||selectedSkin.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedSkin.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedSkin.id}</div></div></div>}
                <div style={{marginTop:10}}><CdBtn id="setskin" onClick={handleSetSkin} variant="violet" disabled={!selectedSkin}><i className="fas fa-check"></i> Set Skin</CdBtn></div>
              </div>

              {/* BACKPACK */}
              <div className="panel section-bar cyan" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:10}}>Backbling</div>
                <SearchInput type="backpack" placeholder="Search backblings..." onSelect={setSelectedBackpack}/>
                {selectedBackpack&&<div className="selected-preview"><img src={selectedBackpack.images?.icon||selectedBackpack.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedBackpack.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedBackpack.id}</div></div></div>}
                <div style={{marginTop:10}}><CdBtn id="setbp" onClick={handleSetBackpack} variant="cyan" disabled={!selectedBackpack}><i className="fas fa-check"></i> Set Backbling</CdBtn></div>
              </div>

              {/* PICKAXE */}
              <div className="panel section-bar fuchsia" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:10}}>Pickaxe</div>
                <SearchInput type="pickaxe" placeholder="Search pickaxes..." onSelect={setSelectedPickaxe}/>
                {selectedPickaxe&&<div className="selected-preview"><img src={selectedPickaxe.images?.icon||selectedPickaxe.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedPickaxe.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedPickaxe.id}</div></div></div>}
                <div style={{marginTop:10}}><CdBtn id="setpk" onClick={handleSetPickaxe} variant="violet" disabled={!selectedPickaxe}><i className="fas fa-check"></i> Set Pickaxe</CdBtn></div>
              </div>

              {/* EMOTE */}
              <div className="panel section-bar amber" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:10}}>Emote</div>
                <SearchInput type="emote" placeholder="Search emotes..." onSelect={setSelectedEmote}/>
                {selectedEmote&&<div className="selected-preview"><img src={selectedEmote.images?.icon||selectedEmote.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedEmote.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedEmote.id}</div></div></div>}
                <div style={{display:'flex',gap:8,marginTop:10}}>
                  <CdBtn id="playem" onClick={()=>handleEmote(false)} variant="cyan" disabled={!selectedEmote}><i className="fas fa-play"></i> Play</CdBtn>
                  <CdBtn id="stopem" onClick={()=>handleEmote(true)} variant="danger"><i className="fas fa-stop"></i> Stop</CdBtn>
                </div>
              </div>
            </>}

            {/* === STATS/PROFILE TAB === */}
            {tab==="stats"&&<>
              <div className="panel section-bar amber" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Season Level</div>
                <div style={{display:'flex',gap:8,maxWidth:360}}>
                  <input type="number" min="1" max="5000" value={level} onChange={e=>setLv(Number(e.target.value))} className="input-field" style={{flex:1,textAlign:'center'}}/>
                  <CdBtn id="setlvl" onClick={handleSetLevel} variant="amber"><i className="fas fa-star"></i> Set</CdBtn>
                </div>
              </div>

              <div className="panel section-bar amber" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Victory Crowns</div>
                <div style={{display:'flex',gap:8,maxWidth:360}}>
                  <input type="number" min="0" max="9999" value={crowns} onChange={e=>setCrowns(Number(e.target.value))} className="input-field" style={{flex:1,textAlign:'center'}}/>
                  <CdBtn id="setcrowns" onClick={handleSetCrowns} variant="amber"><i className="fas fa-crown"></i> Set</CdBtn>
                </div>
              </div>

              <div className="panel section-bar blue" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Banner</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,maxWidth:480}}>
                  <div>
                    <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>Icon ID</div>
                    <input type="text" value={bannerIcon} onChange={e=>setBannerIcon(e.target.value)} className="input-field" placeholder="StandardBanner1"/>
                  </div>
                  <div>
                    <div style={{fontSize:11,color:'var(--text-muted)',marginBottom:4}}>Color ID</div>
                    <input type="text" value={bannerColor} onChange={e=>setBannerColor(e.target.value)} className="input-field" placeholder="DefaultColor1"/>
                  </div>
                </div>
                <div style={{marginTop:10}}><CdBtn id="setbanner" onClick={handleSetLevel} variant="ghost"><i className="fas fa-flag"></i> Apply Banner</CdBtn></div>
              </div>

              <div className="panel section-bar red" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Ghost Mode</div>
                <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>Reset campaign hero to default (hides hero identity)</p>
                <CdBtn id="ghost" onClick={ghostMode} variant="danger"><i className="fas fa-ghost"></i> Activate</CdBtn>
              </div>
            </>}

            {/* === PARTY CONFIG TAB === */}
            {tab==="party"&&<>
              <div className="panel section-bar cyan" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Party Privacy</div>
                <div style={{display:'flex',gap:8}}>
                  {["Public","Friends","Private"].map(p=><CdBtn key={p} id={`priv_${p}`} onClick={()=>handlePrivacy(p)} variant={partyPrivacy===p?"cyan":"ghost"}>
                    <i className={`fas ${p==="Public"?"fa-globe":p==="Friends"?"fa-user-group":"fa-lock"}`}></i> {p}
                  </CdBtn>)}
                </div>
              </div>

              <div className="panel section-bar violet" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Set Playlist</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
                  {PLAYLISTS.map(pl=><div key={pl.id} className="playlist-card" onClick={()=>handleSetPlaylist(pl.id)}>
                    <i className={`fas ${pl.icon}`} style={{color:'var(--accent-cyan)',fontSize:13}}></i>
                    <span style={{fontSize:12,fontWeight:600}}>{pl.name}</span>
                  </div>)}
                </div>
              </div>

              <div className="panel section-bar amber" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Custom Matchmaking Key</div>
                <div style={{display:'flex',gap:8}}>
                  <input type="text" value={customKey} onChange={e=>setCustomKey(e.target.value)} className="input-field" placeholder="Enter custom key..." style={{flex:1}}/>
                  <CdBtn id="setckey" onClick={handleCustomKey} variant="amber"><i className="fas fa-key"></i> Set</CdBtn>
                </div>
              </div>
            </>}

            {/* === MEMBERS TAB === */}
            {tab==="members"&&<div className="panel section-bar emerald" style={{padding:20}}>
              <div className="label-font" style={{marginBottom:12}}>Party Members ({sm.length})</div>
              {sm.length===0?<div style={{textAlign:'center',padding:32,color:'var(--text-muted)'}}><i className="fas fa-users-slash" style={{fontSize:28,opacity:0.3,marginBottom:8,display:'block'}}></i><span style={{fontSize:13}}>No members</span></div>:
              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {sm.map((m,idx)=>{
                  const nm=dn(m),cr=gc(m),pl=gp(m),lv=gl(m),cos=memberDetails[m.account_id]||getCos(m);
                  const st=getReadiness(m);const isMe=m.account_id===active.accountId;
                  return <div key={m.account_id} className="panel-inner member-row" style={{padding:14}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                      <div style={{display:'flex',alignItems:'center',gap:10}}>
                        <div style={{width:36,height:36,borderRadius:8,background:isMe?'linear-gradient(135deg,#0ea5e9,#8b5cf6)':'rgba(56,189,248,0.06)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative'}}>
                          <i className={`fab ${PLAT_ICO[pl]||'fa-desktop'}`} style={{fontSize:14,color:isMe?'white':'var(--text-muted)'}}></i>
                          {m.role==="CAPTAIN"&&<div style={{position:'absolute',top:-4,right:-4,width:14,height:14,background:'var(--accent-amber)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-crown" style={{fontSize:6,color:'#451a03'}}></i></div>}
                        </div>
                        <div>
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <span style={{fontSize:14,fontWeight:700}}>{nm}</span>
                            {isMe&&<span style={{fontSize:10,color:'var(--accent-cyan)'}}>YOU</span>}
                            {cr>0&&<span style={{fontSize:10,background:'rgba(251,191,36,0.12)',color:'var(--accent-amber)',padding:'2px 6px',borderRadius:4,border:'1px solid rgba(251,191,36,0.2)'}}><i className="fas fa-crown" style={{fontSize:7,marginRight:2}}></i>{cr}</span>}
                          </div>
                          <div style={{fontSize:11,color:'var(--text-muted)'}}>{PLATS[pl]||pl} · Lv.{lv}</div>
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span className={`badge badge-${st}`}>{st==="ingame"?"In Match":st==="sitout"?"Sit Out":st==="ready"?"Ready":"Not Ready"}</span>
                        <div className="member-actions" style={{display:'flex',gap:4}}>
                          {!isMe&&<CdBtn id={`cp_${m.account_id}`} onClick={()=>copyLocker(m.account_id)} variant="ghost" className="btn" style={{padding:'4px 8px',fontSize:11}}><i className="fas fa-copy"></i></CdBtn>}
                          {isCap&&!isMe&&<>
                            <CdBtn id={`pm_${m.account_id}`} onClick={()=>doAction("promote",{target:m.account_id},`${nm} promoted`)} variant="amber" className="btn" style={{padding:'4px 8px',fontSize:11}}><i className="fas fa-crown"></i></CdBtn>
                            <CdBtn id={`kk_${m.account_id}`} onClick={()=>doAction("kick",{target:m.account_id},`${nm} kicked`)} variant="danger" className="btn" style={{padding:'4px 8px',fontSize:11}}><i className="fas fa-xmark"></i></CdBtn>
                          </>}
                        </div>
                      </div>
                    </div>
                    <div style={{borderTop:'1px solid var(--border-dim)',paddingTop:10}}>
                      <div className="cos-grid">
                        <div className="cos-cell"><CosImg id={cos.skin} type="skin"/><span>{cos.skinId||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.backpack} type="backpack"/><span>{cos.backpack?.split('/').pop()?.split('.')[0]||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.pickaxe} type="pickaxe"/><span>{cos.pickaxe?.split('/').pop()?.split('.')[0]||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.emote} type="emote"/><span>{cos.emoteId||'None'}</span></div>
                      </div>
                    </div>
                  </div>;
                })}
              </div>}
            </div>}

            {/* === ISLANDS TAB === */}
            {tab==="islands"&&<>
              <div className="panel section-bar emerald" style={{padding:20}}>
                <div className="label-font" style={{marginBottom:12}}>Island Launcher</div>
                {!isCap&&<div style={{padding:'8px 12px',background:'rgba(244,63,94,0.06)',border:'1px solid rgba(244,63,94,0.15)',borderRadius:8,marginBottom:12}}><p style={{fontSize:12,color:'var(--accent-red)'}}><i className="fas fa-triangle-exclamation" style={{marginRight:4}}></i>Only the party leader can launch islands</p></div>}
                <div style={{display:'flex',gap:8}}>
                  <input type="text" value={islandCode} onChange={e=>setIslandCode(e.target.value)} placeholder="1234-5678-9012" className="input-field" style={{flex:1,fontFamily:'monospace'}} disabled={!isCap}/>
                  <CdBtn id="launch" onClick={launchIsland} variant="cyan" disabled={!islandCode.trim()||!isCap}><i className="fas fa-rocket"></i> Launch</CdBtn>
                </div>
              </div>
            </>}

          </div>
        </div>}
        <Toasts/>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
