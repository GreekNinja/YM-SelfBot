<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Equip • FN Party Manager</title>
  <meta name="description" content="Ghost Equip - Premium Fortnite Party Manager. Manage your party, cosmetics, and lobby settings." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #030508;
      --bg-secondary: #080b14;
      --bg-card: rgba(10, 13, 23, 0.88);
      --bg-card-hover: rgba(16, 20, 36, 0.95);
      --border-dim: rgba(99, 102, 241, 0.08);
      --border-active: rgba(99, 102, 241, 0.35);
      --accent-primary: #818cf8;
      --accent-secondary: #6366f1;
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-violet: #8b5cf6;
      --accent-fuchsia: #d946ef;
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f43f5e;
      --accent-orange: #fb923c;
      --text-primary: #e8eaf6;
      --text-secondary: #94a3b8;
      --text-muted: #5c6370;
      --glow-primary: 0 0 40px rgba(99, 102, 241, 0.12);
      --glow-violet: 0 0 40px rgba(139, 92, 246, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .display-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
    }

    .label-font {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.8px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* === AMBIENT BACKGROUND === */
    .ambient-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .ambient-bg::before {
      content: '';
      position: absolute; top: -60%; left: -60%; width: 220%; height: 220%;
      background:
        radial-gradient(ellipse at 15% 30%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 15%, rgba(139, 92, 246, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 60%, rgba(217, 70, 239, 0.03) 0%, transparent 40%);
      animation: ambientDrift 40s ease-in-out infinite alternate;
    }
    .ambient-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, var(--bg-primary) 100%);
    }
    @keyframes ambientDrift {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      33% { transform: translate(-2%, 1%) rotate(1deg) scale(1.02); }
      66% { transform: translate(1%, -1%) rotate(-1deg) scale(0.98); }
      100% { transform: translate(-3%, 2%) rotate(2deg) scale(1.01); }
    }

    .grid-bg {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(99, 102, 241, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.015) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 20%, transparent 65%);
    }

    .particles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(99, 102, 241, 0.4);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }
    @keyframes particleFloat {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(40px); opacity: 0; }
    }

    .scanline {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.008) 3px, rgba(0,0,0,0.008) 6px);
    }

    #root { position: relative; z-index: 1; }

    /* === GLASS PANELS === */
    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(1.1);
      border: 1px solid var(--border-dim);
      border-radius: 16px;
      transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    }
    .panel:hover, .panel:focus-within {
      border-color: var(--border-active);
      box-shadow: var(--glow-primary);
    }
    .panel-inner {
      background: rgba(6, 8, 16, 0.65);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .panel-inner:hover {
      border-color: rgba(99, 102, 241, 0.18);
      background: rgba(10, 13, 23, 0.75);
    }

    /* === INPUTS === */
    .input-field {
      background: rgba(6, 8, 16, 0.75);
      border: 1.5px solid var(--border-dim);
      color: var(--text-primary);
      font-family: 'Exo 2', sans-serif;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      width: 100%;
      transition: all 0.3s ease;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1), 0 0 24px rgba(99, 102, 241, 0.08);
      background: rgba(12, 14, 24, 0.95);
    }
    .input-field::placeholder { color: var(--text-muted); }

    /* === BUTTONS === */
    .btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; }
    .btn:disabled::before { display: none; }

    .btn-cyan {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
      box-shadow: 0 2px 16px rgba(99, 102, 241, 0.3);
    }
    .btn-cyan:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(99, 102, 241, 0.45); }

    .btn-violet {
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: white;
      box-shadow: 0 2px 16px rgba(139, 92, 246, 0.25);
    }
    .btn-violet:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4); }

    .btn-ghost {
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid var(--border-dim);
      color: var(--text-secondary);
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(99, 102, 241, 0.12); border-color: var(--border-active); color: var(--text-primary); transform: translateY(-1px); }

    .btn-danger {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.18);
      color: var(--accent-red);
    }
    .btn-danger:hover:not(:disabled) { background: rgba(244, 63, 94, 0.18); border-color: rgba(244, 63, 94, 0.35); transform: translateY(-1px); }

    .btn-success {
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.18);
      color: var(--accent-emerald);
    }
    .btn-success:hover:not(:disabled) { background: rgba(52, 211, 153, 0.18); border-color: rgba(52, 211, 153, 0.35); transform: translateY(-1px); }

    .btn-amber {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.18);
      color: var(--accent-amber);
    }
    .btn-amber:hover:not(:disabled) { background: rgba(251, 191, 36, 0.18); border-color: rgba(251, 191, 36, 0.35); transform: translateY(-1px); }

    /* === COOLDOWN === */
    @keyframes cooldown { from { width: 100%; } to { width: 0%; } }
    .cd-bar {
      position: absolute; bottom: 0; left: 0; height: 2px;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-orange));
      animation: cooldown 10s linear forwards;
      border-radius: 0 0 12px 12px;
    }
    .cd-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px; font-weight: 700;
      color: var(--accent-red);
      border-radius: inherit;
    }

    /* === SEARCH DROPDOWN === */
    .search-wrap { position: relative; z-index: 1; }
    .search-wrap.open { z-index: 999999; }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .search-drop {
      position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
      background: rgba(8, 10, 18, 0.98);
      backdrop-filter: blur(32px);
      border: 1.5px solid var(--border-active);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(99, 102, 241, 0.08);
      max-height: 300px; overflow-y: auto; z-index: 999999;
      animation: dropIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .search-drop::-webkit-scrollbar { width: 4px; }
    .search-drop::-webkit-scrollbar-track { background: transparent; }
    .search-drop::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
    .search-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.025);
      transition: all 0.2s ease;
    }
    .search-item:last-child { border-bottom: none; }
    .search-item:hover {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.1), transparent);
      padding-left: 20px;
    }
    .search-item img { width: 42px; height: 42px; border-radius: 10px; object-fit: cover; border: 1px solid rgba(255,255,255,0.05); }

    /* === STATUS BADGES === */
    .badge {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700; font-size: 10px; letter-spacing: 1.2px;
      text-transform: uppercase; padding: 4px 10px; border-radius: 8px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-ready { background: rgba(52, 211, 153, 0.1); color: var(--accent-emerald); border: 1px solid rgba(52, 211, 153, 0.2); }
    .badge-notready { background: rgba(100, 116, 139, 0.1); color: var(--text-muted); border: 1px solid rgba(100, 116, 139, 0.15); }
    .badge-sitout { background: rgba(251, 191, 36, 0.1); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.2); }
    .badge-ingame { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.2); }
    .badge-leader { background: rgba(251, 191, 36, 0.12); color: var(--accent-amber); border: 1px solid rgba(251, 191, 36, 0.25); }

    /* === SELECTED PREVIEW === */
    .selected-preview {
      display: flex; align-items: center; gap: 14px;
      padding: 12px; background: rgba(99, 102, 241, 0.04);
      border: 1px solid rgba(99, 102, 241, 0.12);
      border-radius: 12px; margin-top: 10px;
      transition: all 0.3s;
    }
    .selected-preview:hover {
      border-color: rgba(99, 102, 241, 0.25);
      background: rgba(99, 102, 241, 0.06);
    }
    .selected-preview img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; border: 1px solid rgba(255,255,255,0.06); }

    /* === COSMETIC GRID === */
    .cos-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .cos-cell {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 8px 4px; background: rgba(0,0,0,0.25); border-radius: 10px; gap: 5px;
      border: 1px solid transparent;
      transition: all 0.3s;
    }
    .cos-cell:hover {
      border-color: rgba(99, 102, 241, 0.12);
      background: rgba(99, 102, 241, 0.04);
    }
    .cos-cell img { width: 46px; height: 46px; border-radius: 10px; object-fit: cover; }
    .cos-cell span { font-size: 10px; color: var(--text-muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* === ANIMATIONS === */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideInR { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideOutR { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(16px); } }
    @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 16px rgba(99,102,241,0.15); } 50% { box-shadow: 0 0 36px rgba(99,102,241,0.3); } }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes breathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .anim-up { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-in { animation: fadeIn 0.4s ease forwards; }
    .anim-slide { animation: slideInR 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-in { animation: slideInR 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .toast-out { animation: slideOutR 0.25s ease forwards; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(99,102,241,0.1);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .shimmer-text {
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-violet), var(--accent-fuchsia), var(--accent-primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 4s linear infinite;
    }

    /* === TAB INDICATOR === */
    .tab-btn {
      position: relative; padding: 11px 16px; border-radius: 12px;
      font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 13px;
      letter-spacing: 1px; text-transform: uppercase;
      transition: all 0.3s ease; cursor: pointer; border: none;
      display: flex; align-items: center; gap: 10px;
      background: transparent; color: var(--text-muted); width: 100%; text-align: left;
    }
    .tab-btn:hover { color: var(--text-primary); background: rgba(99, 102, 241, 0.05); }
    .tab-btn.active {
      color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid var(--accent-primary);
      box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.03);
    }
    .tab-btn .tab-icon { width: 20px; text-align: center; font-size: 13px; }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.25); border-radius: 4px; }

    /* === RESPONSIVE === */
    @media (max-width: 1024px) {
      .cos-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* === MEMBER HOVER ACTIONS === */
    .member-actions { opacity: 0; transition: opacity 0.25s; }
    .member-row:hover .member-actions { opacity: 1; }

    /* === INVITE SECTION === */
    .invite-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(99, 102, 241, 0.06);
      border: 1px solid rgba(99, 102, 241, 0.12);
      border-radius: 10px; padding: 5px 12px;
      font-size: 12px; color: var(--accent-primary);
    }

    /* === ACCENT BAR ON SECTIONS === */
    .section-bar { position: relative; padding-left: 18px; }
    .section-bar::before {
      content: ''; position: absolute; left: 0; top: 10px; bottom: 10px;
      width: 3px; border-radius: 3px;
    }
    .section-bar.primary::before { background: linear-gradient(180deg, var(--accent-primary), var(--accent-violet)); }
    .section-bar.cyan::before { background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue)); }
    .section-bar.violet::before { background: linear-gradient(180deg, var(--accent-violet), var(--accent-fuchsia)); }
    .section-bar.emerald::before { background: linear-gradient(180deg, var(--accent-emerald), var(--accent-cyan)); }
    .section-bar.amber::before { background: linear-gradient(180deg, var(--accent-amber), var(--accent-orange)); }
    .section-bar.fuchsia::before { background: linear-gradient(180deg, var(--accent-fuchsia), var(--accent-violet)); }
    .section-bar.red::before { background: linear-gradient(180deg, var(--accent-red), var(--accent-fuchsia)); }
    .section-bar.blue::before { background: linear-gradient(180deg, var(--accent-blue), var(--accent-cyan)); }

    /* === HEADER GRADIENT BAR === */
    .header-bar {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), var(--accent-violet), var(--accent-fuchsia), transparent);
      background-size: 200% 100%;
      animation: gradientShift 6s ease infinite;
      border-radius: 0 0 16px 16px;
    }

    /* === ONLINE INDICATOR === */
    .online-dot {
      width: 8px; height: 8px;
      background: var(--accent-emerald);
      border-radius: 50%;
      border: 2px solid var(--bg-primary);
      animation: breathe 2s ease-in-out infinite;
    }

    /* === STAGGER ANIMATION === */
    .stagger-1 { animation-delay: 0.05s; }
    .stagger-2 { animation-delay: 0.1s; }
    .stagger-3 { animation-delay: 0.15s; }
    .stagger-4 { animation-delay: 0.2s; }
    .stagger-5 { animation-delay: 0.25s; }

    /* === LOGO === */
    .logo-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px rgba(99, 102, 241, 0.25);
      position: relative;
    }
  </style>
</head>
<body>
  <div class="ambient-bg"></div>
  <div class="grid-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="scanline"></div>
  <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="spinner"></div></div></div>

  <script>
    // Generate floating particles
    const particlesEl = document.getElementById('particles');
    for(let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (12 + Math.random() * 20) + 's';
      p.style.animationDelay = (Math.random() * 15) + 's';
      p.style.width = (1 + Math.random() * 2) + 'px';
      p.style.height = p.style.width;
      p.style.opacity = (0.15 + Math.random() * 0.35);
      particlesEl.appendChild(p);
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef, useMemo } = React;

    /* ================================================================
       CONSTANTS & CONFIG
    ================================================================ */
    const CORS_PROXIES = [
      { make: url => `https://corsproxy.io/?url=${encodeURIComponent(url)}` },
      { make: url => `https://corsproxy.io/?${encodeURIComponent(url)}` },
      { make: url => `https://cors.bridged.cc/${url}` },
      { make: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
    ];
    let bestProxy = 0; // index of last working proxy

    const ACCT = "https://account-public-service-prod.ol.epicgames.com";

    const CONTENT = "https://content-service.bfda.live.use1a.on.epicgames.com";
    const FRIENDS = "https://friends-public-service-prod.ol.epicgames.com";

    const PC_CL = btoa("34a02cf8f4414e29b15921876da36f9a:daafbccc737745039dffe53d94fc76cf");
    const FN_CL = btoa("ec684b8c687f479fadea3cb2ad83f5c6:e1f31c211f28413186262d37a13fc84d");

    const PLATS = { WIN:"PC", MAC:"Mac", PSN:"PlayStation", XBL:"Xbox", SWT:"Switch", IOS:"Mobile", AND:"Android", GFN:"Cloud" };
    const PLAT_ICO = { WIN:"fa-desktop", MAC:"fa-apple", PSN:"fa-playstation", XBL:"fa-xbox", SWT:"fa-gamepad", IOS:"fa-mobile-screen", AND:"fa-mobile-screen", GFN:"fa-cloud" };

    /* ================================================================
       COOLDOWN MANAGER
    ================================================================ */
    class CooldownMgr {
      constructor() { this.cd = new Map(); this.ls = new Set(); this.iv = null; }
      listen(fn) { this.ls.add(fn); return () => this.ls.delete(fn); }
      notify() { const o = {}; const n = Date.now(); this.cd.forEach((e,k)=>{ if(e>n) o[k]=Math.ceil((e-n)/1000); else this.cd.delete(k); }); this.ls.forEach(f=>f(o)); }
      set(id) { this.cd.set(id, Date.now()+10000); this.notify(); if(!this.iv) this.iv=setInterval(()=>{ let c=0; this.cd.forEach((e)=>{ if(e>Date.now()) c++; }); this.notify(); if(!c){clearInterval(this.iv);this.iv=null;} },1000); }
      get() { const o={}; const n=Date.now(); this.cd.forEach((e,k)=>{ if(e>n) o[k]=Math.ceil((e-n)/1000); }); return o; }
    }

    const sj = async r=>{ try{return await r.json();}catch{return {};} };

    // Multi-proxy fetch with automatic fallback
    const pf = async (url, opts={}) => {
      const order = [bestProxy, ...CORS_PROXIES.map((_,i)=>i).filter(i=>i!==bestProxy)];
      let lastErr;
      for (const idx of order) {
        try {
          const proxyUrl = CORS_PROXIES[idx].make(url);
          const controller = new AbortController();
          const timeout = setTimeout(() => controller.abort(), 12000);
          const r = await fetch(proxyUrl, {...opts, signal: controller.signal});
          clearTimeout(timeout);
          if(r.status===429) throw new Error("Rate limited");
          // Proxy worked — remember it
          bestProxy = idx;
          return r;
        } catch(e) {
          lastErr = e;
          console.warn(`Proxy ${idx} failed:`, e.message);
          continue;
        }
      }
      throw new Error(lastErr?.message || "All proxies failed — check your connection");
    };

    const ep = async (url, cl, data) => {
      const r = await pf(url, { method:"POST", headers:{"Authorization":`Basic ${cl}`,"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(data).toString() });
      const d = await sj(r); if(!r.ok) throw new Error(d.errorMessage||d.error_description||"Auth failed"); return d;
    };

    const refreshTok = async (a) => {
      if(!a) return a;
      if(Date.now()>a.tokenExpiresAt-300000) {
        const r = await ep(`${ACCT}/account/api/oauth/token`,PC_CL,{grant_type:"refresh_token",refresh_token:a.refreshToken});
        return {...a, accessToken:r.access_token, refreshToken:r.refresh_token, tokenExpiresAt:Date.now()+(r.expires_in*1000)};
      }
      return a;
    };

    const pm = (m,k) => { try { const v=m?.meta?.[k]; if(!v) return {}; return JSON.parse(v); } catch{return {};} };
    const dn = m => m?.meta?.["urn:epic:member:dn_s"]||m?.account_id?.slice(0,8)||"?";
    const gp = m => { const d=pm(m,"Default:PlatformData_j"); return d?.PlatformData?.platform?.platformDescription?.name||m?.connections?.[0]?.meta?.["urn:epic:conn:platform_s"]||"WIN"; };
    const gl = m => pm(m,"Default:BattlePassInfo_j")?.BattlePassInfo?.passLevel||1;
    const gc = m => pm(m,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout?.cosmeticStats?.find(x=>x.statName==="TotalVictoryCrowns")?.statValue||0;

    const getCos = m => {

    const getCosImg = async (id, type) => {

    function Toasts(){
      const [list,setList]=useState([]); const [exit,setExit]=useState(new Set());
      useEffect(()=>{
        window._toast=t=>{
          const n=Date.now(); if(t.msg===_lmsg&&n-_ltm<2000)return; _ltm=n;_lmsg=t.msg;
          setList(p=>[...p,t]);
          setTimeout(()=>{setExit(p=>new Set([...p,t.id])); setTimeout(()=>{setList(p=>p.filter(x=>x.id!==t.id)); setExit(p=>{const s=new Set(p);s.delete(t.id);return s;});},250);},3000);
        };

          catch{setRes([]);setOp(false);}

          {ld&&<i className="fas fa-spinner fa-spin" style={{position:'absolute',right:14,top:'50%',transform:'translateY(-50%)',color:'var(--accent-primary)',fontSize:13}}></i>}

            {(s.images?.smallIcon||s.images?.icon)&&<img src={s.images.smallIcon||s.images.icon} alt={s.name}/>}

    /* ================================================================

    function App(){
      const [accounts,setAccts]=useState([]);
      const [active,setActive]=useState(null);
      const [party,setParty]=useState(null);
      const [loading,setLd]=useState(false);
      const [tab,setTab]=useState("match");
      const [authCode,setAuthCode]=useState("");
      const [busy,setBusy]=useState({});
      const [level,setLv]=useState(100);
      const [memberDetails,setMemberDetails]=useState({});
      const [islandCode,setIslandCode]=useState("");
      const [selectedSkin,setSelectedSkin]=useState(null);
      const [selectedBackpack,setSelectedBackpack]=useState(null);
      const [selectedPickaxe,setSelectedPickaxe]=useState(null);
      const [selectedEmote,setSelectedEmote]=useState(null);
      const [inviteUser,setInviteUser]=useState("");
      const [bannerIcon,setBannerIcon]=useState("StandardBanner1");
      const [bannerColor,setBannerColor]=useState("DefaultColor1");
      const [crowns,setCrowns]=useState(0);

      // Token refresh
      useEffect(()=>{
        if(!active) return;
        const iv=setInterval(async()=>{
          try{const r=await refreshTok(active); if(r!==active){setActive(r);const u=accounts.map(a=>a.accountId===r.accountId?r:a);setAccts(u);DB.save("accounts",u);}}
          catch{toast.e("Session expired");setActive(null);setParty(null);}
        },60000);
        return ()=>clearInterval(iv);
      },[active,accounts]);

      useEffect(()=>{const s=DB.load("accounts");if(s?.length){setAccts(s);selectAccount(s[0]);}},[]);

      useEffect(()=>{
        if(!party?.members) return;
        const load=async()=>{const d={};for(const m of party.members) d[m.account_id]=getCos(m);setMemberDetails(d);};
        load();
      },[party]);

      const removeAccount=id=>{const u=accounts.filter(x=>x.accountId!==id);setAccts(u);DB.save("accounts",u);if(active?.accountId===id){setActive(null);setParty(null);}toast.s("Account removed");};

      const getFnTok=async(acct)=>{
        let a=await refreshTok(acct);
        if(a!==acct){setActive(a);const u=accounts.map(x=>x.accountId===a.accountId?a:x);setAccts(u);DB.save("accounts",u);acct=a;}
        const c=tokenCache.get(a.accountId);
        if(c&&c.exp>Date.now()) return c.tok;
        const ex=await sj(await pf(`${ACCT}/account/api/oauth/exchange`,{headers:{Authorization:`Bearer ${a.accessToken}`}}));
        if(!ex.code){removeAccount(a.accountId);throw new Error("Exchange failed");}
        const fn=await ep(`${ACCT}/account/api/oauth/token`,FN_CL,{grant_type:"exchange_code",exchange_code:ex.code});
        tokenCache.set(a.accountId,{tok:fn.access_token,exp:Date.now()+(fn.expires_in-60)*1000});
        return fn.access_token;
      };

      const loadParty=async(a)=>{
        setLd(true);
        try{const t=await getFnTok(a);const r=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${a.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));setParty(r.current?.[0]||null);}
        catch(e){setParty(null);toast.e(e.message);}
        finally{setLd(false);}
      };

      const selectAccount=async a=>{setActive(a);setParty(null);toast.s(`Welcome, ${a.displayName}`);await loadParty(a);};

      const linkAccount=async()=>{
        if(!authCode.trim())return; setLd(true);
        try{
          const r=await ep(`${ACCT}/account/api/oauth/token`,PC_CL,{grant_type:"authorization_code",code:authCode.trim()});
          const a={accountId:r.account_id,displayName:r.displayName||r.account_id,accessToken:r.access_token,refreshToken:r.refresh_token,tokenExpiresAt:Date.now()+(r.expires_in*1000)};
          const u=[...accounts.filter(x=>x.accountId!==a.accountId),a];setAccts(u);DB.save("accounts",u);setAuthCode("");selectAccount(a);
        }catch(e){toast.e(e.message);}finally{setLd(false);}
      };

      const getLatestRev=async()=>{
        try{const t=await getFnTok(active);const r=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${active.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));
        const p=r.current?.[0];if(p){const mm=p.members.find(m=>m.account_id===active.accountId);return{partyRev:p.revision,memberRev:mm?.revision||0,party:p};}
        }catch{}return{partyRev:0,memberRev:0,party:null};

      const doAction=async(type,payload,msg)=>{
        setBusy(p=>({...p,[type]:true}));
        try{
          if(!party?.id) throw new Error("No party found");
          let a=await refreshTok(active);if(a!==active){setActive(a);const u=accounts.map(x=>x.accountId===a.accountId?a:x);setAccts(u);DB.save("accounts",u);}
          const t=await getFnTok(a);
          const rv=await sj(await pf(`${PARTY}/party/api/v1/Fortnite/user/${active.accountId}`,{headers:{Authorization:`Bearer ${t}`}}));
          const pty=rv.current?.[0]; if(!pty) throw new Error("Party not found");
          const pId=pty.id, myRev=pty.members?.find(m=>m.account_id===active.accountId)?.revision||0, pRev=pty.revision||0;
          let url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${active.accountId}/meta`, method="PATCH", body=null;

          if(type==="meta"||type==="party_meta"){
            const isP=type==="party_meta"; if(isP)url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/meta`;
            const upd={}; const src=isP?pty:pty.members.find(m=>m.account_id===active.accountId);
            for(const[k,v]of Object.entries(payload)){if(typeof v==='function'){let o={};if(src?.meta?.[k])try{o=JSON.parse(src.meta[k]);}catch{}upd[k]=JSON.stringify(v(o));}else upd[k]=v;}
            body={update:upd,delete:[],revision:isP?pRev:myRev};
          } else if(type==="promote"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${payload.target}/promote`;method="POST";body={};
          } else if(type==="kick"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/members/${payload.target}`;method="DELETE";
          } else if(type==="invite"){url=`${PARTY}/party/api/v1/Fortnite/parties/${pId}/invites/${payload.target}?sendPing=true`;method="POST";body={};
          }

          const opts={method,headers:{Authorization:`Bearer ${t}`}};
          if(body){opts.headers["Content-Type"]="application/json";opts.body=JSON.stringify(body);}
          const r=await pf(url,opts);
          if(r.status===404){if(msg)toast.s(msg);setTimeout(()=>loadParty(active),600);return;}
          if(!r.ok){const e=await sj(r);throw new Error(e.errorMessage||"Failed");}
          if(msg)toast.s(msg);setTimeout(()=>loadParty(active),600);

      };

      // === COPY LOCKER ===
      const copyLocker=async(tid)=>{
        const tm=party?.members?.find(m=>m.account_id===tid);if(!tm){toast.e("Not found");return;}
        const tc=memberDetails[tid]||getCos(tm);const tn=dn(tm);const tl=gl(tm);

      // === SET SKIN (FIXED — uses definitionPath or AthenaCharacter:ID) ===
      const handleSetSkin=async()=>{
        if(!selectedSkin){toast.e("Select a skin first");return;}

        let fp;
        if (selectedBackpack.definitionPath || selectedBackpack.path) {
          // Use the exact path from the API response
          const rawPath = selectedBackpack.definitionPath || selectedBackpack.path;
          // Strip leading /Game/ or FortniteGame/Content/ if present, keep what comes after
          fp = rawPath;
        } else {
          fp = `/BRCosmetics/Athena/Items/Cosmetics/Backpacks/${bid}.${bid}`;
        }
        const cm=party.members.find(m=>m.account_id===active.accountId);
        const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        try{
          const t=await getFnTok(active);
          const r=await pf(`${PARTY}/party/api/v1/Fortnite/parties/${party.id}/members/${active.accountId}/meta`,{
            method:"PATCH",
            headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},
            body:JSON.stringify({
              update:{
                "Default:AthenaCosmeticLoadout_j":JSON.stringify({
                  AthenaCosmeticLoadout:{
                    ...cl,
                    backpackDef:fp,
                    randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)
                  }
                })
              },
              delete:[],
              revision:memberRev
            })
          });
          if(r.ok){
            toast.s(`Backbling → ${selectedBackpack.name}`);
            setTimeout(()=>loadParty(active),800);
          } else {
            const e=await sj(r);
            if(e.errorCode?.includes("stale_revision")){
              toast.s("Retrying...");setTimeout(()=>handleSetBackpack(),500);
            } else toast.e(e.errorMessage||"Failed");
          }
        }catch(e){toast.e(e.message);}
      };

      // === SET PICKAXE (FIXED — uses definitionPath from API) ===
      const handleSetPickaxe=async()=>{
        if(!selectedPickaxe){toast.e("Select a pickaxe first");return;}
        const{memberRev}=await getLatestRev();
        const pid = selectedPickaxe.id;
        let fp;
        if (selectedPickaxe.definitionPath || selectedPickaxe.path) {
          fp = selectedPickaxe.definitionPath || selectedPickaxe.path;
        } else {
          fp = `/BRCosmetics/Athena/Items/Cosmetics/Pickaxes/${pid}.${pid}`;
        }
        const cm=party.members.find(m=>m.account_id===active.accountId);
        const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        try{
          const t=await getFnTok(active);
          const r=await pf(`${PARTY}/party/api/v1/Fortnite/parties/${party.id}/members/${active.accountId}/meta`,{
            method:"PATCH",
            headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},
            body:JSON.stringify({
              update:{
                "Default:AthenaCosmeticLoadout_j":JSON.stringify({
                  AthenaCosmeticLoadout:{
                    ...cl,
                    pickaxeDef:fp,
                    randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)
                  }
                })
              },
              delete:[],
              revision:memberRev
            })
          });
          if(r.ok){
            toast.s(`Pickaxe → ${selectedPickaxe.name}`);
            setTimeout(()=>loadParty(active),800);
          } else {
            const e=await sj(r);
            if(e.errorCode?.includes("stale_revision")){
              toast.s("Retrying...");setTimeout(()=>handleSetPickaxe(),500);
            } else toast.e(e.errorMessage||"Failed");
          }
        }catch(e){toast.e(e.message);}
      };

      // === EMOTE ===
      const handleEmote=async(stop=false)=>{
        if(stop){await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:"None",emoteEKey:"",emoteSection:-1,multipurposeEmoteData:-1}})},"Emote stopped");return;}
        if(!selectedEmote){toast.e("Select an emote first");return;}
        let fid=selectedEmote.id;if(!fid.startsWith("/BRCosmetics/"))fid=`/BRCosmetics/Athena/Items/Cosmetics/Dances/${fid}.${fid}`;
        await doAction("meta",{"Default:FrontendEmote_j":()=>({FrontendEmote:{pickable:fid,emoteEKey:"",emoteSection:-2,multipurposeEmoteData:-1}})},"Playing emote");
      };

      // === SET LEVEL ===
      const handleSetLevel=async()=>{
        await doAction("meta",{"Default:BattlePassInfo_j":JSON.stringify({BattlePassInfo:{bHasPurchasedPass:true,passLevel:level}}),"Default:AthenaBannerInfo_j":JSON.stringify({AthenaBannerInfo:{bannerIconId:bannerIcon,bannerColorId:bannerColor,seasonLevel:level}})},`Level → ${level}`);
      };

      // === SET CROWNS ===
      const handleSetCrowns=async()=>{
        const cm=party.members.find(m=>m.account_id===active.accountId);const cl=pm(cm,"Default:AthenaCosmeticLoadout_j")?.AthenaCosmeticLoadout||{};
        const stats=cl.cosmeticStats?.map(s=>s.statName==="TotalVictoryCrowns"?{...s,statValue:crowns}:s)||[{statName:"TotalVictoryCrowns",statValue:crowns}];
        await doAction("meta",{"Default:AthenaCosmeticLoadout_j":o=>{const c=o.AthenaCosmeticLoadout||{};return{AthenaCosmeticLoadout:{...c,cosmeticStats:stats,randomDefaultCosmeticHash:Math.floor(Math.random()*2147483647)}};}},`Crowns → ${crowns}`);
      };

      // === INVITE ===
      const handleInvite=async()=>{
        if(!inviteUser.trim())return;
        try{
          const t=await getFnTok(active);
          const lr=await sj(await pf(`${ACCT}/account/api/public/account/displayName/${encodeURIComponent(inviteUser.trim())}`,{headers:{Authorization:`Bearer ${t}`}}));
          if(!lr.id){toast.e("User not found");return;}
          await doAction("invite",{target:lr.id},`Invited ${inviteUser}`);
          setInviteUser("");
        }catch(e){toast.e(e.message);}
      };

      // === ISLAND LAUNCH ===
      const launchIsland=async()=>{
        if(!islandCode.trim()||!active) return;
        const sm=party?.members||[];const isL=sm.find(m=>m.account_id===active.accountId)?.role==="CAPTAIN";
        if(!isL){toast.e("Only leader can launch");return;}
        try{
          const t=await getFnTok(active);const cc=islandCode.trim().replace(/[^0-9-]/g,'');
          if(cc.length<4)throw new Error("Invalid code");
          const r=await pf(`${CONTENT}/api/content/v2/launch/link/${cc}`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({})});
          const d=await sj(r);
          if(r.ok||d.status==="notified"){toast.s(`Launched → ${cc}`);setIslandCode("");}else throw new Error(d.errorMessage||"Failed");
        }catch(e){toast.e(e.message);}
      };

      // === FAKE MATCH ===
      const fakeMatch=async()=>{
        const s=uuid();
        await doAction("meta",{"Default:GameReadiness_s":"Playing","Default:Location_s":"InGame","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="InGame";return o;},"Default:MatchmakingInfo_j":o=>{if(!o.MatchmakingInfo)o.MatchmakingInfo={};o.MatchmakingInfo.readyStatus="NotReady";o.MatchmakingInfo.worldSessionId=s;o.MatchmakingInfo.travelId=s;return o;}},"In match");
      };

      const leaveMatch=async()=>{
        await doAction("meta",{"Default:GameReadiness_s":"NotReady","Default:Location_s":"PreLobby","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="PreLobby";return o;},"Default:MatchmakingInfo_j":o=>{if(o.MatchmakingInfo)o.MatchmakingInfo.readyStatus="NotReady";return o;}},"Left match");
      };

      // === READINESS ===
      const setReady=async(state)=>{
        const map={Ready:"Ready",NotReady:"NotReady",SittingOut:"SittingOut"};
        await doAction("meta",{"Default:GameReadiness_s":map[state]||"NotReady","Default:Location_s":"PreLobby","Default:PackedState_j":o=>{if(o.PackedState)o.PackedState.location="PreLobby";return o;},"Default:MatchmakingInfo_j":o=>{if(o.MatchmakingInfo)o.MatchmakingInfo.readyStatus=map[state]||"NotReady";return o;}},state);
      };

      /* ================================================================
         LOGIN SCREEN
      ================================================================ */
      if(!active) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
        <div className="panel anim-up" style={{maxWidth:440,width:'100%',overflow:'hidden'}}>
          <div className="header-bar"></div>
          <div style={{padding:'36px 36px 32px'}}>
            <div style={{textAlign:'center',marginBottom:32}}>
              <div className="logo-icon" style={{margin:'0 auto 18px'}}>
                <i className="fas fa-ghost" style={{fontSize:20,color:'white'}}></i>
              </div>
              <h1 className="shimmer-text display-font" style={{fontSize:24}}>GHOST EQUIP</h1>
              <p style={{fontSize:12,color:'var(--text-muted)',marginTop:8,fontFamily:"'Rajdhani',sans-serif",letterSpacing:2.5,textTransform:'uppercase'}}>Fortnite Party Manager</p>
            </div>

            {accounts.length>0&&<div style={{marginBottom:24}}>
              <div className="label-font" style={{marginBottom:10}}>Saved Accounts</div>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {accounts.map(a=><div key={a.accountId} onClick={()=>selectAccount(a)} className="panel-inner" style={{padding:'12px 16px',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'space-between',transition:'all 0.2s'}}>
                  <div style={{display:'flex',alignItems:'center',gap:12}}>
                    <div style={{width:34,height:34,borderRadius:10,background:'linear-gradient(135deg,#6366f1,#8b5cf6)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-user" style={{fontSize:11,color:'white'}}></i></div>
                    <span style={{fontSize:14,fontWeight:600}}>{a.displayName}</span>
                  </div>
                  <button onClick={e=>{e.stopPropagation();removeAccount(a.accountId);}} className="btn btn-danger" style={{padding:'5px 10px',fontSize:10}}><i className="fas fa-trash"></i></button>
                </div>)}
              </div>
            </div>}

            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <a href="https://www.epicgames.com/id/api/redirect?clientId=34a02cf8f4414e29b15921876da36f9a&responseType=code" target="_blank" className="btn btn-ghost" style={{width:'100%',textDecoration:'none',padding:13}}><i className="fas fa-external-link-alt"></i> Get Auth Code</a>
              <div style={{display:'flex',gap:8}}>
                <input type="text" placeholder="Paste authorization code..." value={authCode} onChange={e=>setAuthCode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&linkAccount()} className="input-field" style={{flex:1}}/>
                <button onClick={linkAccount} disabled={loading||!authCode.trim()} className="btn btn-cyan" style={{minWidth:70}}>{loading?<i className="fas fa-spinner fa-spin"></i>:"Link"}</button>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:6,marginTop:2}}>
                <div style={{width:16,height:16,borderRadius:6,background:'rgba(99,102,241,0.08)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-shield-halved" style={{fontSize:8,color:'var(--accent-primary)'}}></i></div>
                <p style={{fontSize:11,color:'var(--text-muted)'}}>Tokens stored locally in your browser</p>
              </div>
            </div>
          </div>
        </div>
      </div>;

      /* ================================================================
         MAIN DASHBOARD
      ================================================================ */
      const sm=party?.members||[];
      const isCap=sm.find(m=>m.account_id===active.accountId)?.role==="CAPTAIN";
      const myMember=sm.find(m=>m.account_id===active.accountId);
      const myReadiness=myMember?getReadiness(myMember):"notready";

      const TABS=[
        {id:"match",icon:"fa-crosshairs",label:"Match"},
        {id:"locker",icon:"fa-shirt",label:"Locker"},
        {id:"stats",icon:"fa-chart-bar",label:"Profile"},
        {id:"members",icon:"fa-users",label:`Members (${sm.length})`},
        {id:"islands",icon:"fa-globe",label:"Islands"},
      ];

      return <div style={{minHeight:'100vh',padding:'16px',maxWidth:1260,margin:'0 auto'}}>
        {/* HEADER */}
        <div className="panel anim-up" style={{marginBottom:18,overflow:'hidden'}}>
          <div style={{padding:'14px 22px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              <div className="logo-icon">
                <i className="fas fa-ghost" style={{fontSize:17,color:'white'}}></i>
                <div className="online-dot" style={{position:'absolute',bottom:-2,right:-2}}></div>
              </div>
              <div>
                <h1 className="shimmer-text display-font" style={{fontSize:16}}>GHOST EQUIP</h1>
                <div style={{fontSize:12,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:8,marginTop:1}}>
                  <span style={{display:'flex',alignItems:'center',gap:5}}><i className="fas fa-circle" style={{fontSize:4,color:'var(--accent-emerald)'}}></i>{active.displayName}</span>
                  {isCap&&<span className="badge badge-leader" style={{padding:'2px 7px'}}><i className="fas fa-crown" style={{fontSize:7}}></i>Leader</span>}
                  <span className={`badge badge-${myReadiness}`} style={{padding:'2px 7px'}}>
                    {myReadiness==="ingame"?"In Match":myReadiness==="sitout"?"Sit Out":myReadiness==="ready"?"Ready":"Idle"}
                  </span>
                </div>
              </div>
            </div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>loadParty(active)} disabled={loading} className="btn btn-ghost" style={{fontSize:12}}><i className={`fas fa-sync-alt${loading?' fa-spin':''}`} style={{fontSize:11}}></i>Refresh</button>
              <button onClick={()=>{setActive(null);setParty(null);}} className="btn btn-danger" style={{fontSize:12}}><i className="fas fa-right-from-bracket" style={{fontSize:11}}></i>Exit</button>
            </div>
          </div>
          <div className="header-bar"></div>
        </div>

        {!party?<div className="panel anim-up" style={{padding:56,textAlign:'center'}}>
          <div style={{width:64,height:64,margin:'0 auto 16px',borderRadius:16,background:'rgba(99,102,241,0.06)',display:'flex',alignItems:'center',justifyContent:'center',border:'1px solid rgba(99,102,241,0.1)'}}><i className="fas fa-gamepad" style={{fontSize:24,color:'var(--accent-primary)',opacity:0.5}}></i></div>
          <h2 className="display-font" style={{fontSize:18,color:'var(--accent-primary)',marginBottom:8}}>No Active Party</h2>
          <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:24}}>Launch Fortnite and join a lobby to get started</p>
          <button onClick={()=>loadParty(active)} className="btn btn-cyan"><i className="fas fa-sync-alt"></i>Check Again</button>
        </div>:

        <div style={{display:'grid',gridTemplateColumns:'210px 1fr',gap:18}}>
          {/* SIDEBAR */}
          <div className="panel anim-up" style={{padding:10,alignSelf:'start',position:'sticky',top:16}}>
            <div style={{display:'flex',flexDirection:'column',gap:3}}>
              {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} className={`tab-btn${tab===t.id?' active':''}`}>
                <span className="tab-icon"><i className={`fas ${t.icon}`}></i></span>
                <span>{t.label}</span>
              </button>)}
            </div>
            {/* Mini party info */}
            <div style={{borderTop:'1px solid var(--border-dim)',marginTop:12,paddingTop:12,paddingLeft:4,paddingRight:4}}>
              <div style={{fontSize:10,color:'var(--text-muted)',fontFamily:"'Rajdhani',sans-serif",fontWeight:600,textTransform:'uppercase',letterSpacing:1.5,marginBottom:8}}>Party ({sm.length}/16)</div>
              <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                {sm.slice(0,8).map(m=>{
                  const st=getReadiness(m);
                  const colors={ready:'var(--accent-emerald)',notready:'var(--text-muted)',sitout:'var(--accent-amber)',ingame:'var(--accent-blue)'};
                  return <div key={m.account_id} title={dn(m)} style={{width:24,height:24,borderRadius:6,background:m.account_id===active.accountId?'linear-gradient(135deg,#6366f1,#8b5cf6)':'rgba(255,255,255,0.04)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:700,color:m.account_id===active.accountId?'white':'var(--text-muted)',border:`1px solid ${colors[st]}25`,position:'relative'}}>
                    {dn(m).charAt(0).toUpperCase()}
                    <div style={{position:'absolute',bottom:-1,right:-1,width:6,height:6,borderRadius:'50%',background:colors[st],border:'1.5px solid var(--bg-primary)'}}></div>
                  </div>;
                })}
                {sm.length>8&&<div style={{width:24,height:24,borderRadius:6,background:'rgba(255,255,255,0.03)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,color:'var(--text-muted)'}}>+{sm.length-8}</div>}
              </div>
            </div>
          </div>

          {/* CONTENT */}
          <div style={{display:'flex',flexDirection:'column',gap:14}} className="anim-slide">

            {/* === MATCH TAB === */}
            {tab==="match"&&<>
              <div className="panel section-bar emerald" style={{padding:22}}>
                <div className="label-font" style={{marginBottom:14}}>Readiness</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
                  <CdBtn id="rdy" onClick={()=>setReady("Ready")} variant="success"><i className="fas fa-check"></i> Ready</CdBtn>
                  <CdBtn id="nrdy" onClick={()=>setReady("NotReady")}><i className="fas fa-xmark"></i> Not Ready</CdBtn>
                  <CdBtn id="sit" onClick={()=>setReady("SittingOut")} variant="amber"><i className="fas fa-moon"></i> Sit Out</CdBtn>
                  <CdBtn id="stnd" onClick={()=>setReady("NotReady")} variant="ghost"><i className="fas fa-person"></i> Stand In</CdBtn>
                </div>
              </div>

              <div className="panel section-bar violet" style={{padding:22}}>
                <div className="label-font" style={{marginBottom:14}}>Fake Match</div>
                <div style={{display:'flex',gap:10}}>
                  <CdBtn id="fmatch" onClick={fakeMatch} variant="violet" className="flex-1"><i className="fas fa-play"></i> Enter Match</CdBtn>
                  <CdBtn id="lmatch" onClick={leaveMatch} className="flex-1"><i className="fas fa-door-open"></i> Leave Match</CdBtn>
                </div>
              </div>

              <div className="panel section-bar primary" style={{padding:22}}>
                <div className="label-font" style={{marginBottom:14}}>Invite Player</div>
                <div style={{display:'flex',gap:10}}>
                  <div style={{flex:1,position:'relative'}}>
                    <i className="fas fa-user-plus" style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',fontSize:12}}></i>
                    <input type="text" placeholder="Epic display name..." value={inviteUser} onChange={e=>setInviteUser(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleInvite()} className="input-field" style={{paddingLeft:38}}/>
                  </div>
                  <CdBtn id="invite" onClick={handleInvite} variant="cyan" disabled={!inviteUser.trim()}><i className="fas fa-paper-plane"></i> Invite</CdBtn>
                </div>
              </div>
            </>}

            {/* === LOCKER TAB === */}
            {tab==="locker"&&<>
              <div className="panel" style={{padding:'12px 18px',background:'rgba(99,102,241,0.03)',borderColor:'rgba(99,102,241,0.1)'}}>
                <p style={{fontSize:12,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:8}}>
                  <i className="fas fa-info-circle" style={{color:'var(--accent-primary)'}}></i>
                  Set to <span style={{color:'var(--accent-amber)',fontWeight:600}}>Sit Out</span> or <span style={{color:'var(--text-secondary)',fontWeight:600}}>Not Ready</span> before changing cosmetics
                </p>
              </div>

              {/* SKIN */}
              <div className="panel section-bar violet" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(139,92,246,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-user" style={{fontSize:11,color:'var(--accent-violet)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Skin</div>
                </div>
                <SearchInput type="outfit" placeholder="Search skins..." onSelect={setSelectedSkin}/>
                {selectedSkin&&<div className="selected-preview"><img src={selectedSkin.images?.icon||selectedSkin.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedSkin.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedSkin.id}</div></div></div>}
                <div style={{marginTop:12}}><CdBtn id="setskin" onClick={handleSetSkin} variant="violet" disabled={!selectedSkin}><i className="fas fa-check"></i> Set Skin</CdBtn></div>
              </div>

              {/* BACKPACK */}
              <div className="panel section-bar cyan" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(56,189,248,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-bag-shopping" style={{fontSize:11,color:'var(--accent-cyan)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Backbling</div>
                </div>
                <SearchInput type="backpack" placeholder="Search backblings..." onSelect={setSelectedBackpack}/>
                {selectedBackpack&&<div className="selected-preview"><img src={selectedBackpack.images?.icon||selectedBackpack.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedBackpack.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedBackpack.id}</div></div></div>}
                <div style={{marginTop:12}}><CdBtn id="setbp" onClick={handleSetBackpack} variant="cyan" disabled={!selectedBackpack}><i className="fas fa-check"></i> Set Backbling</CdBtn></div>
              </div>

              {/* PICKAXE */}
              <div className="panel section-bar fuchsia" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(217,70,239,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-hammer" style={{fontSize:11,color:'var(--accent-fuchsia)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Pickaxe</div>
                </div>
                <SearchInput type="pickaxe" placeholder="Search pickaxes..." onSelect={setSelectedPickaxe}/>
                {selectedPickaxe&&<div className="selected-preview"><img src={selectedPickaxe.images?.icon||selectedPickaxe.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedPickaxe.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedPickaxe.id}</div></div></div>}
                <div style={{marginTop:12}}><CdBtn id="setpk" onClick={handleSetPickaxe} variant="violet" disabled={!selectedPickaxe}><i className="fas fa-check"></i> Set Pickaxe</CdBtn></div>
              </div>

              {/* EMOTE */}
              <div className="panel section-bar amber" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(251,191,36,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-music" style={{fontSize:11,color:'var(--accent-amber)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Emote</div>
                </div>
                <SearchInput type="emote" placeholder="Search emotes..." onSelect={setSelectedEmote}/>
                {selectedEmote&&<div className="selected-preview"><img src={selectedEmote.images?.icon||selectedEmote.images?.smallIcon} alt=""/><div><div style={{fontSize:14,fontWeight:700}}>{selectedEmote.name}</div><div style={{fontSize:11,color:'var(--text-muted)'}}>{selectedEmote.id}</div></div></div>}
                <div style={{display:'flex',gap:10,marginTop:12}}>
                  <CdBtn id="playem" onClick={()=>handleEmote(false)} variant="cyan" disabled={!selectedEmote}><i className="fas fa-play"></i> Play</CdBtn>
                  <CdBtn id="stopem" onClick={()=>handleEmote(true)} variant="danger"><i className="fas fa-stop"></i> Stop</CdBtn>
                </div>
              </div>
            </>}

            {/* === PROFILE TAB === */}
            {tab==="stats"&&<>
              <div className="panel section-bar amber" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(251,191,36,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-star" style={{fontSize:11,color:'var(--accent-amber)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Season Level</div>
                </div>
                <div style={{display:'flex',gap:10,maxWidth:380}}>
                  <input type="number" min="1" max="5000" value={level} onChange={e=>setLv(Number(e.target.value))} className="input-field" style={{flex:1,textAlign:'center',fontFamily:"'Orbitron',sans-serif",fontWeight:600}}/>
                  <CdBtn id="setlvl" onClick={handleSetLevel} variant="amber"><i className="fas fa-star"></i> Set</CdBtn>
                </div>
              </div>

              <div className="panel section-bar amber" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(251,191,36,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-crown" style={{fontSize:11,color:'var(--accent-amber)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Victory Crowns</div>
                </div>
                <div style={{display:'flex',gap:10,maxWidth:380}}>
                  <input type="number" min="0" max="9999" value={crowns} onChange={e=>setCrowns(Number(e.target.value))} className="input-field" style={{flex:1,textAlign:'center',fontFamily:"'Orbitron',sans-serif",fontWeight:600}}/>
                  <CdBtn id="setcrowns" onClick={handleSetCrowns} variant="amber"><i className="fas fa-crown"></i> Set</CdBtn>
                </div>
              </div>

              <div className="panel section-bar blue" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(59,130,246,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-flag" style={{fontSize:11,color:'var(--accent-blue)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Banner</div>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,maxWidth:500}}>
                  <div>
                    <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:5,fontFamily:"'Rajdhani',sans-serif",fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>Icon ID</div>
                    <input type="text" value={bannerIcon} onChange={e=>setBannerIcon(e.target.value)} className="input-field" placeholder="StandardBanner1"/>
                  </div>
                  <div>
                    <div style={{fontSize:10,color:'var(--text-muted)',marginBottom:5,fontFamily:"'Rajdhani',sans-serif",fontWeight:600,textTransform:'uppercase',letterSpacing:1}}>Color ID</div>
                    <input type="text" value={bannerColor} onChange={e=>setBannerColor(e.target.value)} className="input-field" placeholder="DefaultColor1"/>
                  </div>
                </div>
                <div style={{marginTop:12}}><CdBtn id="setbanner" onClick={handleSetLevel} variant="ghost"><i className="fas fa-flag"></i> Apply Banner</CdBtn></div>
              </div>
            </>}

            {/* === MEMBERS TAB === */}
            {tab==="members"&&<div className="panel section-bar emerald" style={{padding:22}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
                <div className="label-font">Party Members ({sm.length}/16)</div>
                <button onClick={()=>loadParty(active)} disabled={loading} className="btn btn-ghost" style={{padding:'6px 12px',fontSize:11}}><i className={`fas fa-sync-alt${loading?' fa-spin':''}`} style={{fontSize:10}}></i></button>
              </div>
              {sm.length===0?<div style={{textAlign:'center',padding:40,color:'var(--text-muted)'}}>
                <div style={{width:52,height:52,margin:'0 auto 12px',borderRadius:14,background:'rgba(99,102,241,0.05)',display:'flex',alignItems:'center',justifyContent:'center'}}><i className="fas fa-users-slash" style={{fontSize:20,opacity:0.4}}></i></div>
                <span style={{fontSize:13}}>No members in party</span>
              </div>:
              <div style={{display:'flex',flexDirection:'column',gap:10}}>
                {sm.map((m,idx)=>{
                  const nm=dn(m),cr=gc(m),pl=gp(m),lv=gl(m),cos=memberDetails[m.account_id]||getCos(m);
                  const st=getReadiness(m);const isMe=m.account_id===active.accountId;
                  return <div key={m.account_id} className="panel-inner member-row" style={{padding:16,animationDelay:`${idx*0.05}s`}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
                      <div style={{display:'flex',alignItems:'center',gap:12}}>
                        <div style={{width:38,height:38,borderRadius:10,background:isMe?'linear-gradient(135deg,#6366f1,#8b5cf6)':'rgba(99,102,241,0.06)',display:'flex',alignItems:'center',justifyContent:'center',position:'relative',border:isMe?'none':'1px solid rgba(255,255,255,0.04)'}}>
                          <i className={`fab ${PLAT_ICO[pl]||'fa-desktop'}`} style={{fontSize:14,color:isMe?'white':'var(--text-muted)'}}></i>
                          {m.role==="CAPTAIN"&&<div style={{position:'absolute',top:-5,right:-5,width:16,height:16,background:'linear-gradient(135deg,#fbbf24,#f59e0b)',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 8px rgba(251,191,36,0.3)'}}><i className="fas fa-crown" style={{fontSize:6,color:'#451a03'}}></i></div>}
                        </div>
                        <div>
                          <div style={{display:'flex',alignItems:'center',gap:7}}>
                            <span style={{fontSize:14,fontWeight:700}}>{nm}</span>
                            {isMe&&<span style={{fontSize:9,color:'white',background:'linear-gradient(135deg,#6366f1,#818cf8)',padding:'1px 6px',borderRadius:4,fontWeight:700,letterSpacing:0.5}}>YOU</span>}
                            {cr>0&&<span style={{fontSize:10,background:'rgba(251,191,36,0.1)',color:'var(--accent-amber)',padding:'2px 7px',borderRadius:6,border:'1px solid rgba(251,191,36,0.15)',fontWeight:700}}><i className="fas fa-crown" style={{fontSize:7,marginRight:3}}></i>{cr}</span>}
                          </div>
                          <div style={{fontSize:11,color:'var(--text-muted)',marginTop:1}}>{PLATS[pl]||pl} · Lv.{lv}</div>
                        </div>
                      </div>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span className={`badge badge-${st}`}>{st==="ingame"?"In Match":st==="sitout"?"Sit Out":st==="ready"?"Ready":"Idle"}</span>
                        <div className="member-actions" style={{display:'flex',gap:4}}>
                          {!isMe&&<CdBtn id={`cp_${m.account_id}`} onClick={()=>copyLocker(m.account_id)} variant="ghost" className="btn" style={{padding:'5px 10px',fontSize:10}} title="Copy Locker"><i className="fas fa-copy"></i></CdBtn>}
                          {isCap&&!isMe&&<>
                            <CdBtn id={`pm_${m.account_id}`} onClick={()=>doAction("promote",{target:m.account_id},`${nm} promoted`)} variant="amber" className="btn" style={{padding:'5px 10px',fontSize:10}} title="Promote"><i className="fas fa-crown"></i></CdBtn>
                            <CdBtn id={`kk_${m.account_id}`} onClick={()=>doAction("kick",{target:m.account_id},`${nm} kicked`)} variant="danger" className="btn" style={{padding:'5px 10px',fontSize:10}} title="Kick"><i className="fas fa-xmark"></i></CdBtn>
                          </>}
                        </div>
                      </div>
                    </div>
                    <div style={{borderTop:'1px solid var(--border-dim)',paddingTop:12}}>
                      <div className="cos-grid">
                        <div className="cos-cell"><CosImg id={cos.skin} type="skin"/><span>{cos.skinId||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.backpack} type="backpack"/><span>{cos.backpack?.split('/').pop()?.split('.')[0]||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.pickaxe} type="pickaxe"/><span>{cos.pickaxe?.split('/').pop()?.split('.')[0]||'None'}</span></div>
                        <div className="cos-cell"><CosImg id={cos.emote} type="emote"/><span>{cos.emoteId||'None'}</span></div>
                      </div>
                    </div>
                  </div>;
                })}
              </div>}
            </div>}

            {/* === ISLANDS TAB === */}
            {tab==="islands"&&<>
              <div className="panel section-bar emerald" style={{padding:22}}>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:14}}>
                  <div style={{width:28,height:28,borderRadius:8,background:'rgba(52,211,153,0.1)',display:'flex',alignItems:'center',justifyContent:'center'}}>
                    <i className="fas fa-rocket" style={{fontSize:11,color:'var(--accent-emerald)'}}></i>
                  </div>
                  <div className="label-font" style={{margin:0}}>Island Launcher</div>
                </div>
                {!isCap&&<div style={{padding:'10px 14px',background:'rgba(244,63,94,0.04)',border:'1px solid rgba(244,63,94,0.1)',borderRadius:10,marginBottom:14,display:'flex',alignItems:'center',gap:8}}>
                  <i className="fas fa-triangle-exclamation" style={{color:'var(--accent-red)',fontSize:12}}></i>
                  <p style={{fontSize:12,color:'var(--accent-red)'}}>Only the party leader can launch islands</p>
                </div>}
                <div style={{display:'flex',gap:10}}>
                  <div style={{flex:1,position:'relative'}}>
                    <i className="fas fa-globe" style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'var(--text-muted)',fontSize:12}}></i>
                    <input type="text" value={islandCode} onChange={e=>setIslandCode(e.target.value)} placeholder="1234-5678-9012" className="input-field" style={{paddingLeft:38,fontFamily:'monospace',letterSpacing:1}} disabled={!isCap}/>
                  </div>
                  <CdBtn id="launch" onClick={launchIsland} variant="cyan" disabled={!islandCode.trim()||!isCap}><i className="fas fa-rocket"></i> Launch</CdBtn>
                </div>
              </div>
            </>}

          </div>
        </div>}
        <Toasts/>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
